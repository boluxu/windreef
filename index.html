<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="风浪潮">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Long Reef 风浪潮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one dark sea-chart console. Spot pill → wind/wave compass for the chosen hour → model tabs → day tabs + timeline → hourly sheet with a highlighted column → tide card. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#1f3a4a; --deep:#183140; --panel:#264657; --panel2:#2d5265; --line:#36596b;
  --ink:#eef5f7; --muted:#9cb5c0; --dim:#7893a0;
  --accent:#19e3b1; --warn:#ffb648; --red:#ff5a5f;
  --wave:#4aa6e8; --wavebox:#2f6f9c; --tide:#6fd3e8; --tidefill:rgba(111,211,232,.18);
  --night:rgba(5,18,26,.38); --colsel:rgba(255,255,255,.20); --cellink:#0b1c24;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;gap:10px;align-items:center}
.round{flex:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center}
.round svg{width:22px;height:22px}
.pill{flex:1;min-width:0;height:48px;border-radius:24px;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;gap:8px;padding:0 18px;text-align:left}
.pill b{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill small{color:var(--muted);font-family:var(--display);font-size:14px;white-space:nowrap;margin-left:auto}

/* now card */
.now{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:14px;align-items:center;background:var(--deep);border-radius:16px;padding:14px}
.now svg text{font-family:var(--display)}
.nowinfo{display:flex;flex-direction:column;gap:8px;min-width:0}
.nowtime{font-size:13px;color:var(--muted)}
.nowtime b{color:var(--ink);font-weight:600}
.stat{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.stat .big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.stat .u{color:var(--muted);font-size:13px}
.stat .lab{font-size:12px;color:var(--muted);width:100%}
.sailbadge{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:6px 10px;align-self:flex-start}
.sailbadge svg{width:18px;height:22px}
.sailbadge b{font-family:var(--display);font-size:22px}
.sailbadge span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.now{grid-template-columns:150px minmax(0,1fr)}.stat .big{font-size:28px}}

/* model tabs */
.models{display:flex;gap:4px;background:var(--deep);border-radius:14px;padding:5px;overflow-x:auto;scrollbar-width:none}
.models button{flex:none;border:0;background:transparent;border-radius:10px;padding:9px 14px;font-weight:600;color:var(--ink);white-space:nowrap}
.models button[aria-pressed="true"]{background:var(--accent);color:var(--cellink)}

/* day tabs + timeline */
.daytabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(52px,1fr);overflow-x:auto;scrollbar-width:none}
.daytabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;padding:4px 0;color:var(--muted);font-family:var(--display);font-weight:600;line-height:1.1}
.daytabs button .w{font-size:16px}
.daytabs button .n{font-size:22px}
.daytabs button.we{color:var(--ink)}
.daytabs button[aria-pressed="true"]{color:var(--accent)}
.daytabs button.far .n{opacity:.7}
.timeline{position:relative;height:22px;margin:4px 6px 0;cursor:pointer;touch-action:pan-y}
.timeline .bar{position:absolute;inset:6px 0;border-radius:6px}
.timeline .win{position:absolute;top:2px;bottom:2px;border:3px solid #fff;border-radius:9px;background:rgba(255,255,255,.25);pointer-events:none;min-width:22px;transform:translateX(-50%)}
.tlnote{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:2px 6px 0}

/* sheet */
.sheetbox{background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.sheetwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
table.sheet{border-collapse:separate;border-spacing:0;font-family:var(--display);font-variant-numeric:tabular-nums}
.sheet th,.sheet td{padding:0;text-align:center;white-space:nowrap}
.sheet td{min-width:46px;height:40px;font-size:19px;font-weight:600;cursor:pointer}
.sheet th.lab{position:sticky;left:0;z-index:3;background:var(--bg);font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);text-align:center;width:62px;min-width:62px;max-width:62px;border-right:1px solid var(--line);line-height:1.15;padding:0 4px;white-space:normal}
.sheet tr.date th{font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted);text-align:left;padding:10px 0 4px;letter-spacing:.06em}
.sheet tr.date th:not(.lab){border-left:1px solid var(--line)}
.sheet tr.date th span{position:sticky;left:74px;padding-left:8px}
.sheet tr.hr td{font-size:20px;font-weight:700;height:40px}
.sheet td.night{background-color:var(--night)}
.sheet tr.hr td.night{background:#132a36}
.sheet td.d0{border-left:1px solid var(--line)}
.sheet td.col{box-shadow:inset 0 0 0 999px var(--colsel)}
.sheet tr.hr td.col{background:#5f7f8e;border-radius:12px 12px 0 0}
.sheet tr.last td.col{border-radius:0 0 12px 12px}
.sheet td.c{color:var(--cellink)}
.sheet td.s{font-size:16px;font-weight:500;color:var(--muted)}
.sheet td.sail{font-size:14px;line-height:1}
.sheet td.sail svg{display:block;margin:2px auto 0;width:16px;height:20px}
.sheet td.sail .ov{color:var(--red)}
.arr{display:inline-block;width:20px;height:20px;vertical-align:middle}
.arr svg{display:block}
.wbox{display:inline-grid;place-items:center;width:34px;height:26px;background:var(--wavebox);color:#fff;border-radius:9px}
.sheet tr.sec th{font-size:11px;letter-spacing:.06em;color:var(--dim);text-align:center;padding:8px 2px 2px;font-weight:600}
.sheet tr.sec td{height:6px;cursor:default}
.mk{display:block;font-size:11px;line-height:1;color:var(--tide);font-weight:600}
.tval{font-size:15px}

/* cards */
.card{background:var(--deep);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.card h2 b{color:var(--ink)}
.tidelist{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.tl{background:var(--panel);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.tl .k{font-size:12px;color:var(--muted)}
.tl .v{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.tl .h{font-family:var(--display);font-size:14px;color:var(--muted)}
.meta{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.meta .sun{display:flex;gap:18px;font-family:var(--display);font-size:17px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.note b{color:var(--ink)}
.banner{background:var(--panel);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.banner b{color:var(--warn)}
.foot{font-size:12px;color:var(--dim);line-height:1.6}
.foot a{color:inherit}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.legend{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.legend i{flex:1}
.legendlab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-family:var(--display)}

/* sheets (drawers) */
.scrim{position:fixed;inset:0;background:rgba(4,14,20,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.drawer{background:var(--deep);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.drawer h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.drawer h3 button{border:0;background:var(--panel);border-radius:8px;padding:6px 12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.field .hint{font-size:12px;color:var(--dim)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field input,.field select{width:100%;box-sizing:border-box}
.srow input{width:100%;box-sizing:border-box}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--cellink);font-weight:600}
.srow{display:flex;gap:8px}
.srow input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{border:0;background:var(--accent);color:var(--cellink);font-weight:600;border-radius:10px;padding:10px 16px}
.btn.ghost{background:var(--panel);color:var(--ink);font-weight:500}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:10px 12px;border:1.5px solid transparent;text-align:left;width:100%}
.item[aria-current="true"]{border-color:var(--accent)}
.item span{flex:1;min-width:0}
.item small{color:var(--muted)}
.item .del{flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;padding:0 4px}
.msg{font-size:13px;color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <button class="pill" id="spotBtn" type="button" aria-label="切换地点"><b id="spotName">Long Reef Headland</b><small id="spotCoord"></small></button>
    <button class="round" id="setBtn" type="button" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
  </div>
  <div id="banner"></div>
  <div id="app"><div class="loading">正在载入预报…</div></div>
  <div class="foot">数据来源：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>（CC BY 4.0）。风来自所选模型（ECMWF、NOAA GFS、德国 ICON）；浪与涌近 10 天用最佳组合模型，之后用 NOAA GFS 海浪模型补足到 16 天；潮汐根据 Open-Meteo 海平面数据（含过去 92 天）做调和分析推算，时间误差约半小时，礁石区活动请以 <a href="http://www.bom.gov.au/australia/tides/" target="_blank" rel="noopener">澳大利亚气象局潮汐表</a> 为准。建议帆面积为经验估算，仅供参考。</div>
</div>
<div id="layer"></div>

<script>
const SNAPSHOT = /*SNAPSHOT*/null;
(function(){
"use strict";
const $=s=>document.querySelector(s);
const DEF={name:"Long Reef Headland",lat:-33.7418,lon:151.3222};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let spots=store.get("wr.spots",[DEF]); if(!spots.length) spots=[DEF];
let cur=store.get("wr.cur",spots[0]);
let model=store.get("wr.model","best_match");
let cfg=Object.assign({weight:75,minSail:3.5,maxSail:9,style:"std",quiver:"",unit:"kn",step:1},store.get("wr.cfg",{}));
let data=null, selI=null, fit=null;
const MODELS=[["best_match","自动最佳"],["ecmwf_ifs025","欧洲 ECMWF"],["gfs_seamless","美国 GFS"],["icon_seamless","德国 ICON"]];

/* ---------- helpers ---------- */
const WK=["日","一","二","三","四","五","六"];
function parseT(s){const[y,m,d]=s.slice(0,10).split("-").map(Number);const h=+s.slice(11,13)||0,mi=+s.slice(14,16)||0;return Date.UTC(y,m-1,d,h,mi)/36e5}
function fmtHM(th){const d=new Date(th*36e5);return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0")}
function dayKey(th){return new Date(th*36e5).toISOString().slice(0,10)}
function wk(date){const[y,m,d]=date.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
const STOPS=[[0,[150,200,226]],[4,[96,176,226]],[8,[72,150,214]],[11,[80,200,120]],[15,[150,214,60]],[18,[226,226,50]],[22,[240,184,48]],[26,[238,128,46]],[31,[222,72,62]],[40,[182,52,132]],[55,[110,40,140]]];
function windColor(k){if(k==null)return"transparent";let i=0;while(i<STOPS.length-2&&k>STOPS[i+1][0])i++;const[a0,c0]=STOPS[i],[a1,c1]=STOPS[i+1];const t=Math.max(0,Math.min(1,(k-a0)/(a1-a0)));const c=c0.map((v,j)=>Math.round(v+(c1[j]-v)*t));return`rgb(${c[0]},${c[1]},${c[2]})`}
function arrow(fromDeg,size=20){if(fromDeg==null)return"";const r=(fromDeg+180)%360;return`<span class="arr" style="width:${size}px;height:${size}px"><svg viewBox="0 0 20 20" width="${size}" height="${size}" style="transform:rotate(${r}deg)"><path d="M10 17V4.5M4.8 9.6 10 4.4l5.2 5.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`}
const CARD=["北","北偏东北","东北","东偏东北","东","东偏东南","东南","南偏东南","南","南偏西南","西南","西偏西南","西","西偏西北","西北","北偏西北"];
function card(d){return d==null?"":CARD[Math.round(d/22.5)%16]+"风"}
function cardW(d){return d==null?"":"来自"+CARD[Math.round(d/22.5)%16]}
const f1=v=>v==null?"–":(Math.round(v*10)/10).toFixed(1);
const f0=v=>v==null?"–":String(Math.round(v));
const UNIT={kn:["节",1],ms:["米/秒",0.514444],kmh:["公里/时",1.852]};
const wv=k=>{if(k==null)return"–";const v=k*UNIT[cfg.unit][1];return cfg.unit==="ms"?f1(v):f0(v)};
const wu=()=>UNIT[cfg.unit][0];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const sailIcon=`<svg viewBox="0 0 16 20"><path d="M4 2.2C9.5 4.6 13.2 10 12.6 16.4 12.55 16.8 12.2 17 11.8 17H4.8C4.35 17 4 16.65 4 16.2Z" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.2" stroke-linejoin="round"/><rect x="1.5" y="18" width="13" height="1.8" rx=".9" fill="var(--accent)"/></svg>`;

/* ---------- sail size ---------- */
// 经验公式：帆面积(㎡) ≈ 1.34 × 体重(kg) ÷ 风速(节)。保守 ×0.88，激进 ×1.12
function sailFor(kn){
  if(kn==null)return{v:null};
  const k={safe:0.88,std:1,bold:1.12}[cfg.style]||1;
  let s=1.34*cfg.weight/Math.max(kn,0.1)*k;
  const q=String(cfg.quiver||"").split(/[,，\s]+/).map(Number).filter(x=>x>0).sort((a,b)=>a-b);
  if(s>cfg.maxSail*1.08)return{v:null,low:true};
  if(s<cfg.minSail*0.85)return{v:null,high:true};
  s=Math.max(cfg.minSail,Math.min(cfg.maxSail,s));
  if(q.length){let best=q[0];for(const x of q)if(Math.abs(x-s)<Math.abs(best-s))best=x;return{v:best,own:true}}
  return{v:Math.round(s*10)/10};
}

/* ---------- tide harmonic analysis ---------- */
const CONS=[28.9841042,30.0,28.4397295,15.0410686,13.9430356,13.3986609,57.9682084,58.9841042,57.4238337,27.8953548,27.9682084,28.5125831,29.5284789,86.9523127];
function fitTide(ts,vs){
  const pts=[];for(let i=0;i<ts.length;i++)if(vs[i]!=null)pts.push([ts[i],vs[i]]);
  if(pts.length<24*20)return null;
  const t0=pts.reduce((s,p)=>s+p[0],0)/pts.length;
  const w=CONS.map(c=>c*Math.PI/180);const n=1+2*w.length;
  const A=Array.from({length:n},()=>new Float64Array(n)),b=new Float64Array(n),row=new Float64Array(n);
  for(const[t,y]of pts){const tt=t-t0;row[0]=1;w.forEach((wi,j)=>{row[1+2*j]=Math.cos(wi*tt);row[2+2*j]=Math.sin(wi*tt)});
    for(let i=0;i<n;i++){b[i]+=row[i]*y;const ri=row[i],Ai=A[i];for(let k=0;k<n;k++)Ai[k]+=ri*row[k]}}
  for(let i=0;i<n;i++)A[i][i]+=1e-6;
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];
    for(let r=c+1;r<n;r++){const f=A[r][c]/A[c][c];if(!f)continue;for(let k=c;k<n;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c]}}
  const x=new Float64Array(n);for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=A[r][k]*x[k];x[r]=s/A[r][r]}
  return {h:t=>{const tt=t-t0;let s=0;for(let j=0;j<w.length;j++)s+=x[1+2*j]*Math.cos(w[j]*tt)+x[2+2*j]*Math.sin(w[j]*tt);return s},mean:x[0]};
}
function extrema(f,a,b){const out=[];const dt=0.1;let p=f(a-dt),c=f(a);for(let t=a;t<=b;t+=dt){const nx=f(t+dt);if(c>p&&c>=nx)out.push({t,hi:true});else if(c<p&&c<=nx)out.push({t,hi:false});p=c;c=nx}
  return out.map(e=>{const y0=f(e.t-dt),y1=f(e.t),y2=f(e.t+dt);const d=(y0-2*y1+y2);const off=d?0.5*(y0-y2)/d*dt:0;return{t:e.t+off,h:f(e.t+off),hi:e.hi}})}

/* ---------- data ---------- */
function urls(s,m){
  const fc=`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,precipitation,precipitation_probability&daily=sunrise,sunset&forecast_days=16&wind_speed_unit=kn&timezone=auto&models=${m}&cell_selection=sea`;
  const mv="wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,sea_surface_temperature";
  const mr=`https://marine-api.open-meteo.com/v1/marine?latitude=${s.lat}&longitude=${s.lon}&hourly=${mv}&forecast_days=16&timezone=auto&models=best_match,ncep_gfswave025&cell_selection=sea`;
  const td=`https://marine-api.open-meteo.com/v1/marine?latitude=${s.lat}&longitude=${s.lon}&hourly=sea_level_height_msl&past_days=92&forecast_days=16&timezone=auto&cell_selection=sea`;
  return{fc,mr,td};
}
async function getJSON(u){const r=await fetch(u);if(!r.ok){let m="";try{m=(await r.json()).reason}catch(e){}throw new Error(m||("HTTP "+r.status))}return r.json()}
function sameSpot(a,b){return a&&b&&Math.abs(a.lat-b.lat)<1e-3&&Math.abs(a.lon-b.lon)<1e-3}
function localDateIn(tz){try{return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}}
function nowTh(tz){try{const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return parseT(`${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}`)}catch(e){return null}}

function normalize(raw){
  const {fc,mr,td}=raw;const H=fc.hourly,M=mr.hourly;
  const mIdx=new Map(M.time.map((t,i)=>[t,i]));
  const pick=(k,i)=>{if(i==null)return null;const a=M[k+"_marine_best_match"]??M[k];const g=M[k+"_ncep_gfswave025"];const v=a?a[i]:null;return v!=null?v:(g?g[i]:null)};
  const hours=H.time.map((t,i)=>{const j=mIdx.get(t);
    return{t,th:parseT(t),date:t.slice(0,10),hh:+t.slice(11,13),ws:H.wind_speed_10m[i],wg:H.wind_gusts_10m[i],wd:H.wind_direction_10m[i],temp:H.temperature_2m[i],pr:H.precipitation[i],pp:H.precipitation_probability?H.precipitation_probability[i]:null,
      wh:pick("wave_height",j),wdir:pick("wave_direction",j),wp:pick("wave_period",j),sh:pick("swell_wave_height",j),sd:pick("swell_wave_direction",j),sp:pick("swell_wave_period",j),sst:pick("sea_surface_temperature",j)}}).filter(h=>h.ws!=null);
  const sun={};fc.daily.time.forEach((d,i)=>sun[d]={rise:fc.daily.sunrise[i],set:fc.daily.sunset[i]});
  fit=fitTide(td.hourly.time.map(parseT),td.hourly.sea_level_height_msl);
  if(fit)hours.forEach(h=>h.tide=fit.h(h.th));
  const dates=[...new Set(hours.map(h=>h.date))];
  const tideX=fit?extrema(fit.h,hours[0].th,hours[hours.length-1].th+1):[];
  return{hours,sun,dates,tideX,tz:fc.timezone};
}

async function load(){
  $("#app").innerHTML='<div class="loading">正在载入预报…</div>';$("#banner").innerHTML="";
  renderTop();
  const u=urls(cur,model);let raw=null,mode="live",err=null;
  try{const[fc,mr,td]=await Promise.all([getJSON(u.fc),getJSON(u.mr),getJSON(u.td)]);raw={fc,mr,td,fetched:new Date().toISOString()}}
  catch(e){err=e}
  if(!raw&&SNAPSHOT&&sameSpot(SNAPSHOT.spot,cur)){const fc=SNAPSHOT.fc[model]||SNAPSHOT.fc.best_match;raw={fc,mr:SNAPSHOT.mr,td:SNAPSHOT.td,fetched:SNAPSHOT.fetched};mode="snap"}
  if(!raw){$("#app").innerHTML=`<div class="banner"><b>载入失败</b>：${esc(err&&err.message||"网络错误")}。这个页面需要访问 open-meteo.com，请检查网络后重试。</div>`;return}
  data=normalize(raw);data.mode=mode;
  const n=nowTh(data.tz);let i=data.hours.findIndex(h=>h.th>=n-0.5);if(i<0)i=0;selI=i;
  if(mode==="snap"){const g=new Date(raw.fetched);$("#banner").innerHTML=`<div class="banner"><b>快照数据</b>，抓取于 ${g.toLocaleString("zh-CN",{timeZone:"Australia/Sydney",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}（悉尼时间）。当前预览环境不能联网，所以不会自动更新、也不能搜索新地点。把这个网页文件放到 GitHub Pages 等普通网址后，每次打开都会获取最新数据。</div>`}
  render(true);
}

/* ---------- render ---------- */
function renderTop(){
  $("#spotName").textContent=cur.name;
  $("#spotCoord").textContent=`${Math.abs(cur.lat).toFixed(2)}°${cur.lat<0?"南":"北"} ${Math.abs(cur.lon).toFixed(2)}°${cur.lon<0?"西":"东"}`;
}
function shownHours(){return data.hours.filter(h=>h.hh%cfg.step===0)}
function snapSel(){const hs=data.hours;if(cfg.step>1){let i=selI;while(i>0&&hs[i].hh%cfg.step)i--;selI=i}}

function render(scroll){
  snapSel();
  const d=data,h=d.hours[selI],today=localDateIn(d.tz);
  let html="";
  html+=nowCard(h);
  html+=`<div class="models" role="group" aria-label="风的预报模型">${MODELS.map(([k,l])=>`<button type="button" data-m="${k}" aria-pressed="${k===model}">${l}</button>`).join("")}</div>`;
  // day tabs
  html+=`<div><div class="daytabs" id="days">${d.dates.map((dt,i)=>{const w=wk(dt);return`<button type="button" data-d="${dt}" class="${w===0||w===6?"we":""}${i>=7?" far":""}" aria-pressed="${dt===h.date}"><span class="w">${dt===today?"今天":"周"+WK[w]}</span><span class="n">${dt.slice(8)}</span></button>`}).join("")}</div>`;
  const stops=d.hours.map((x,i)=>`${windColor(x.ws)} ${(i/(d.hours.length-1)*100).toFixed(2)}%`).join(",");
  html+=`<div class="timeline" id="tl"><div class="bar" style="background:linear-gradient(90deg,${stops})"></div><div class="win" style="left:${(selI/(d.hours.length-1)*100).toFixed(2)}%;width:${Math.max(22,100/d.hours.length*24)}px"></div></div>
    <div class="tlnote"><span>拖动或点击色条选择时间</span><span>第 8 天以后只看趋势</span></div></div>`;
  html+=sheet();
  html+=tideCard(h.date);
  html+=metaCard(h.date);
  $("#app").innerHTML=html;
  if(scroll)scrollToSel(false);
}

function nowCard(h){
  const s=sailFor(h.ws);const n=nowTh(data.tz);const isNow=n&&Math.abs(h.th-n)<1;
  const sailTxt=s.v?`<b>${s.v}</b><span>m² 建议帆${s.own?"（你的帆）":""}<br>体重 ${cfg.weight} kg</span>`:s.low?`<b>–</b><span>风太小，最大 ${cfg.maxSail} m² 也难滑行</span>`:`<b>!</b><span>风太大，比你最小的 ${cfg.minSail} m² 帆还需要更小</span>`;
  return`<div class="now">${compass(h)}<div class="nowinfo">
    <div class="nowtime">${isNow?"<b>现在</b> · ":""}周${WK[wk(h.date)]} ${+h.date.slice(5,7)}月${+h.date.slice(8)}日 <b>${String(h.hh).padStart(2,"0")}:00</b></div>
    <div class="stat"><span class="big" style="color:${windColor(h.ws)}">${wv(h.ws)}</span><span class="u">${wu()} · 阵风 ${wv(h.wg)}</span><span class="lab">${card(h.wd)}</span></div>
    <div class="stat"><span class="big" style="color:var(--wave)">${f1(h.wh)}</span><span class="u">米 · ${f1(h.wp)} 秒</span><span class="lab">浪${cardW(h.wdir)}${h.tide!=null?` · 潮位 ${h.tide>=0?"+":""}${h.tide.toFixed(2)} 米`:""}</span></div>
    <div class="sailbadge">${sailIcon}${sailTxt}</div></div></div>`;
}

function compass(h){
  const C=100,R=78;
  const band=(deg,color,len,wid,label,off)=>{if(deg==null)return"";
    // band starts outside and points to centre from the direction it comes from
    const a=deg*Math.PI/180,sx=C+Math.sin(a)*(R+18),sy=C-Math.cos(a)*(R+18);
    return`<g transform="rotate(${deg} ${C} ${C})"><rect x="${C-wid/2+off}" y="${C-R-18}" width="${wid}" height="${len}" rx="${wid/2}" fill="${color}" opacity=".95"/><path d="M${C+off} ${C-R-18+len+10} l-${wid/2+1} -11 h${wid+2} z" fill="${color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/></g>`};
  let ticks="";for(let i=0;i<72;i++){const a=i*5*Math.PI/180,r1=R,r2=i%6===0?R-8:R-4;ticks+=`<line x1="${C+Math.sin(a)*r1}" y1="${C-Math.cos(a)*r1}" x2="${C+Math.sin(a)*r2}" y2="${C-Math.cos(a)*r2}" stroke="var(--line)" stroke-width="${i%6===0?2:1}"/>`}
  const lab=(t,a,col)=>{const r=R-20,x=C+Math.sin(a*Math.PI/180)*r,y=C-Math.cos(a*Math.PI/180)*r+6;return`<text x="${x}" y="${y}" text-anchor="middle" font-size="17" font-weight="700" fill="${col}">${t}</text>`};
  return`<svg viewBox="0 0 200 200" width="100%" role="img" aria-label="风向与浪向罗盘"><circle cx="${C}" cy="${C}" r="${R}" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>${ticks}
    ${lab("北",0,"var(--red)")}${lab("东",90,"var(--muted)")}${lab("南",180,"var(--muted)")}${lab("西",270,"var(--muted)")}
    ${band(h.wdir,"#d6e6ee",70,16,"",9)}${band(h.wd,windColor(h.ws),78,20,"",-9)}
    <circle cx="${C}" cy="${C}" r="5" fill="var(--ink)"/></svg>`;
}

function sheet(){
  const d=data,hs=shownHours(),sel=d.hours[selI];
  const groups=[];hs.forEach(h=>{const g=groups[groups.length-1];if(g&&g.date===h.date)g.n++;else groups.push({date:h.date,n:1})});
  const isNight=h=>{const s=d.sun[h.date];if(!s)return false;return h.hh<+s.rise.slice(11,13)||h.hh>+s.set.slice(11,13)};
  const tideMarks=new Map();d.tideX.forEach(x=>{const k=Math.round(x.t/cfg.step)*cfg.step;tideMarks.set(k,x)});
  const cls=(h,i,extra)=>{const c=[extra||""];if(i===0||hs[i-1].date!==h.date)c.push("d0");if(isNight(h))c.push("night");if(h.th===sel.th)c.push("col");return c.join(" ")};
  const rows=[
    ["hr","",h=>String(h.hh).padStart(2,"0")],
    ["sail","建议帆<br>m²",h=>{const s=sailFor(h.ws);return s.v?`${s.v}${sailIcon}`:s.high?`<span class="ov">风大</span>`:"–"}],
    ["","风向",h=>arrow(h.wd)],
    ["c","风速<br>"+wu(),h=>wv(h.ws),h=>`background:${windColor(h.ws)}`],
    ["c","阵风<br>"+wu(),h=>wv(h.wg),h=>`background:${windColor(h.wg)}`],
    ["s","气温<br>°C",h=>f0(h.temp)+"°"],
    ["s","降水<br>毫米",h=>h.pr?f1(h.pr):"0"],
    ["s","水温<br>°C",h=>f0(h.sst)+"°"],
    ["sec","海浪"],
    ["","浪向",h=>h.wdir==null?"–":`<span class="wbox">${arrow(h.wdir,16)}</span>`],
    ["","浪高<br>米",h=>f1(h.wh)],
    ["s","周期<br>秒",h=>f1(h.wp)],
    ["s","涌浪<br>米",h=>f1(h.sh)],
    ["s","涌周期<br>秒",h=>f1(h.sp)],
  ];
  if(d.tideX.length){rows.push(["tval","潮位<br>米",h=>{const m=tideMarks.get(h.th);return(m?`<span class="mk">${m.hi?"▲高":"▼低"} ${fmtHM(m.t)}</span>`:"")+`${h.tide>=0?"+":""}${h.tide.toFixed(1)}`}])}
  let s=`<div class="sheetbox"><div class="sheetwrap" id="sheet"><table class="sheet"><tbody><tr class="date"><th class="lab">${cfg.step===1?"逐时":"3 小时"}</th>`;
  groups.forEach(g=>s+=`<th colspan="${g.n}" id="dh-${g.date}"><span>周${WK[wk(g.date)]}，${+g.date.slice(5,7)}月${+g.date.slice(8)}日</span></th>`);s+="</tr>";
  rows.forEach((r,ri)=>{const[c,label,fn,st]=r;
    if(c==="sec"){s+=`<tr class="sec"><th class="lab">${label}</th><td colspan="${hs.length}"></td></tr>`;return}
    s+=`<tr class="${c==="hr"?"hr":""}${ri===rows.length-1?" last":""}"><th class="lab">${label}</th>`;
    hs.forEach((h,i)=>{s+=`<td data-th="${h.th}" class="${cls(h,i,c==="hr"?"":c)}"${st?` style="${st(h)}"`:""}>${fn(h)}</td>`});s+="</tr>"});
  return s+"</tbody></table></div></div>";
}

function tideCard(day){
  if(!fit)return`<div class="card"><h2>潮汐</h2><div class="note">这个地点没有可用的海平面数据，无法推算潮汐。</div></div>`;
  const ex=data.tideX.filter(x=>dayKey(x.t)===day);
  return`<div class="card"><h2>潮汐 · <b>周${WK[wk(day)]} ${+day.slice(5,7)}月${+day.slice(8)}日</b></h2>${tideSVG(day)}
    <div class="tidelist">${ex.map(x=>`<div class="tl"><span class="k">${x.hi?"高潮 ▲":"低潮 ▼"}</span><span class="v">${fmtHM(x.t)}</span><span class="h">${x.h>=0?"+":""}${x.h.toFixed(2)} 米</span></div>`).join("")}</div>
    <div class="note">高度相对平均海平面。看潮池、走礁石选低潮前后 1–2 小时；帆板下水注意高潮时岸边浪更容易拍上礁石。</div></div>`;
}
function tideSVG(day){
  const W=Math.round(Math.max(320,Math.min(680,(document.querySelector(".wrap")?.clientWidth||680)-28))),Hh=180,pl=34,pr=8,pt=22,pb=24;const t0=parseT(day+"T00:00"),t1=t0+24;
  const f=fit.h;const pts=[];for(let t=t0;t<=t1+1e-9;t+=0.25)pts.push([t,f(t)]);
  const all=data.tideX.map(x=>x.h);const gmn=Math.min(...all,-0.8)-0.05,gmx=Math.max(...all,0.8)+0.05;
  const x=t=>pl+(t-t0)/24*(W-pl-pr),y=v=>pt+(gmx-v)/(gmx-gmn)*(Hh-pt-pb);
  const s=data.sun[day];let night="";
  if(s){const r=parseT(s.rise),st=parseT(s.set);night=`<rect x="${pl}" y="${pt}" width="${x(r)-pl}" height="${Hh-pt-pb}" fill="var(--night)"/><rect x="${x(st)}" y="${pt}" width="${W-pr-x(st)}" height="${Hh-pt-pb}" fill="var(--night)"/>`}
  const path="M"+pts.map(p=>x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join(" L");
  let g="";for(let hh=0;hh<=24;hh+=3)g+=`<text x="${x(t0+hh)}" y="${Hh-6}" text-anchor="middle" font-size="12" fill="var(--muted)">${String(hh).padStart(2,"0")}</text>`;
  [-1,-0.5,0,0.5,1].filter(v=>v>=gmn&&v<=gmx).forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===0?"":"2 4"}"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v>0?"+":""}${v}</text>`);
  let mk="";data.tideX.filter(e=>e.t>=t0&&e.t<t1).forEach(e=>{const X=x(e.t),Y=y(e.h);mk+=`<circle cx="${X}" cy="${Y}" r="4" fill="var(--tide)"/><text x="${Math.min(Math.max(X,pl+18),W-pr-18)}" y="${e.hi?Y-9:Y+18}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${fmtHM(e.t)}</text>`});
  const sel=data.hours[selI];let sl="";if(sel.date===day)sl=`<line x1="${x(sel.th)}" x2="${x(sel.th)}" y1="${pt-6}" y2="${Hh-pb}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  const n=nowTh(data.tz);let now="";if(n&&n>=t0&&n<=t1)now=`<line x1="${x(n)}" x2="${x(n)}" y1="${pt}" y2="${Hh-pb}" stroke="var(--accent)" stroke-width="2"/><text x="${Math.min(x(n)+4,W-30)}" y="${pt-8}" font-size="12" fill="var(--accent)">现在</text>`;
  return`<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="display:block" role="img" aria-label="当日潮汐曲线">${night}${g}<path d="${path} L${x(t1)} ${Hh-pb} L${x(t0)} ${Hh-pb} Z" fill="var(--tidefill)"/><path d="${path}" fill="none" stroke="var(--tide)" stroke-width="2.5"/>${mk}${sl}${now}</svg>`;
}
function metaCard(day){
  const s=data.sun[day];const ml=MODELS.find(m=>m[0]===model)[1];
  return`<div class="card"><div class="meta">${s?`<div class="sun"><span>日出 ${s.rise.slice(11)}</span><span>日落 ${s.set.slice(11)}</span></div>`:""}
  <div>风的预报模型：<b style="color:var(--ink)">${ml}</b>。不同模型数值会有差异，可以切换对比；差得越多，说明这段时间越不确定。</div>
  <div class="legend">${[0,4,8,11,15,18,22,26,31,40].map(k=>`<i style="background:${windColor(k)}"></i>`).join("")}</div>
  <div class="legendlab"><span>0</span><span>8</span><span>15</span><span>22</span><span>31</span><span>40+ 节</span></div></div></div>`;
}

function scrollToSel(smooth){
  const wrap=$("#sheet");const td=wrap&&wrap.querySelector("td.col");if(td){wrap.scrollTo({left:Math.max(0,td.offsetLeft-62-td.offsetWidth*1.5),behavior:smooth?"smooth":"auto"})}
  const b=document.querySelector(`#days button[aria-pressed="true"]`),ds=$("#days");if(b&&ds)ds.scrollLeft=Math.max(0,b.offsetLeft-ds.clientWidth/2+b.clientWidth/2);
}
function select(i,scroll){selI=Math.max(0,Math.min(data.hours.length-1,i));const sx=$("#sheet")?.scrollLeft;render(false);if(scroll)scrollToSel(false);else if(sx!=null)$("#sheet").scrollLeft=sx}

/* ---------- drawers ---------- */
function openDrawer(html,onMount){$("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="drawer" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim"||e.target.closest("[data-close]"))closeDrawer()});onMount&&onMount()}
function closeDrawer(){$("#layer").innerHTML=""}

function spotDrawer(){
  const list=()=>spots.map((s,i)=>`<div class="item" aria-current="${sameSpot(s,cur)}"><button type="button" data-pick="${i}" style="all:unset;flex:1;cursor:pointer"><span>${esc(s.name)}</span><br><small>${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}</small></button>${spots.length>1?`<button type="button" class="del" data-del="${i}" aria-label="删除 ${esc(s.name)}">×</button>`:""}</div>`).join("");
  openDrawer(`<h3>地点<button type="button" data-close>完成</button></h3>
    <div class="srow"><input id="q" type="search" placeholder="搜索海滩或地名，或输入 纬度,经度" autocomplete="off"><button class="btn" id="go" type="button">搜索</button></div>
    <div class="list" id="res"></div><div class="field"><label>我收藏的地点</label><div class="list" id="saved">${list()}</div></div>`,()=>{
    const run=async()=>{const q=$("#q").value.trim(),box=$("#res");if(!q)return;
      const m=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
      if(m){addSpot({name:`${(+m[1]).toFixed(3)}, ${(+m[2]).toFixed(3)}`,lat:+m[1],lon:+m[2]});return}
      box.innerHTML='<div class="note">搜索中…</div>';
      try{const r=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=zh&format=json`);const res=r.results||[];
        box.innerHTML=res.length?res.map((p,i)=>`<button type="button" class="item" data-r="${i}"><span>${esc(p.name)}<br><small>${esc([p.admin1,p.country].filter(Boolean).join("，"))}</small></span>＋</button>`).join(""):'<div class="msg">没找到。可以试试英文名（如 Long Reef），或直接输入 纬度,经度。</div>';
        box.onclick=e=>{const b=e.target.closest("[data-r]");if(b){const p=res[+b.dataset.r];addSpot({name:p.name,lat:p.latitude,lon:p.longitude})}};
      }catch(e){box.innerHTML='<div class="msg">搜索需要联网访问 open-meteo.com，当前预览环境不允许。放到 GitHub Pages 等普通网址后即可搜索。也可以直接输入 纬度,经度 添加地点。</div>'}};
    $("#go").onclick=run;$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
    $("#saved").onclick=e=>{const d=e.target.closest("[data-del]");if(d){const i=+d.dataset.del;const was=sameSpot(spots[i],cur);spots.splice(i,1);store.set("wr.spots",spots);$("#saved").innerHTML=list();if(was)choose(spots[0]);return}
      const p=e.target.closest("[data-pick]");if(p){choose(spots[+p.dataset.pick]);closeDrawer()}};
  });
  function addSpot(s){if(!spots.some(x=>sameSpot(x,s))){spots.push(s);store.set("wr.spots",spots)}choose(s);closeDrawer()}
}
function choose(s){cur=s;store.set("wr.cur",cur);load()}

function setDrawer(){
  const seg=(id,opts,val)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(v)===String(val)}">${l}</button>`).join("")}</div>`;
  openDrawer(`<h3>设置<button type="button" data-close>完成</button></h3>
    <div class="field"><label>帆板：你的体重</label><div class="srow"><input id="weight" type="number" inputmode="decimal" min="30" max="150" step="1" value="${cfg.weight}"><span style="align-self:center;color:var(--muted)">公斤</span></div><div class="hint">按经验公式 帆面积 ≈ 1.34 × 体重 ÷ 风速（节）估算建议帆。</div></div>
    <div class="two"><div class="field"><label>最小的帆（m²）</label><input id="minSail" type="number" inputmode="decimal" step="0.1" value="${cfg.minSail}"></div>
      <div class="field"><label>最大的帆（m²）</label><input id="maxSail" type="number" inputmode="decimal" step="0.1" value="${cfg.maxSail}"></div></div>
    <div class="field"><label>我有的帆（可选，用逗号分隔）</label><input id="quiver" type="text" placeholder="例如 4.7, 5.8, 7.0, 8.5" value="${esc(cfg.quiver)}"><div class="hint">填了以后，建议会直接选你手上最接近的那张帆。</div></div>
    <div class="field"><label>风格</label>${seg("style",[["safe","保守"],["std","标准"],["bold","激进"]],cfg.style)}<div class="hint">保守＝更小的帆、更好控制；激进＝更大的帆、更早滑行。</div></div>
    <div class="field"><label>风速单位</label>${seg("unit",[["kn","节"],["ms","米/秒"],["kmh","公里/时"]],cfg.unit)}</div>
    <div class="field"><label>表格时间间隔</label>${seg("step",[[1,"逐 1 小时"],[3,"逐 3 小时"]],cfg.step)}</div>`,()=>{
    const num=(id,min,max)=>{const el=$("#"+id);el.addEventListener("change",()=>{let v=parseFloat(el.value);if(!isFinite(v))v=cfg[id];v=Math.max(min,Math.min(max,v));el.value=v;cfg[id]=v;if(cfg.minSail>cfg.maxSail){const t=cfg.minSail;cfg.minSail=cfg.maxSail;cfg.maxSail=t}save()})};
    num("weight",30,150);num("minSail",1,13);num("maxSail",1,13);
    $("#quiver").addEventListener("change",e=>{cfg.quiver=e.target.value;save()});
    ["style","unit","step"].forEach(id=>$("#"+id).addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;cfg[id]=id==="step"?+b.dataset.v:b.dataset.v;$("#"+id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));save()}));
  });
  function save(){store.set("wr.cfg",cfg);if(data)select(selI,true)}
}

/* ---------- events ---------- */
$("#spotBtn").onclick=spotDrawer;
$("#setBtn").onclick=setDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
$("#app").addEventListener("click",e=>{
  const m=e.target.closest("[data-m]");if(m){if(m.dataset.m!==model){model=m.dataset.m;store.set("wr.model",model);const th=data&&data.hours[selI].th;load().then(()=>{if(data&&th){const i=data.hours.findIndex(h=>h.th===th);if(i>=0)select(i,true)}})}return}
  const dbtn=e.target.closest("#days [data-d]");if(dbtn){const dt=dbtn.dataset.d;const n=nowTh(data.tz);let i=data.hours.findIndex(h=>h.date===dt&&h.hh===12);if(dt===localDateIn(data.tz)){const j=data.hours.findIndex(h=>h.th>=n-0.5);if(j>=0)i=j}if(i<0)i=data.hours.findIndex(h=>h.date===dt);select(i,true);return}
  const td=e.target.closest("td[data-th]");if(td){const th=+td.dataset.th;select(data.hours.findIndex(h=>h.th===th),false);return}
});
let dragging=false;
function tlPick(e){const tl=$("#tl");if(!tl)return;const r=tl.getBoundingClientRect();const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));select(Math.round(p*(data.hours.length-1)),true)}
$("#app").addEventListener("pointerdown",e=>{if(e.target.closest("#tl")){dragging=true;tlPick(e)}});
window.addEventListener("pointermove",e=>{if(dragging)tlPick(e)});
window.addEventListener("pointerup",()=>dragging=false);

load();
})();
</script>

</body>
</html>
