<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="风浪潮">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath d=%22M6 2C14 6 19 13 18 21H6Z%22 fill=%22%2319e3b1%22/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>风浪潮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: three views. 首页 = 我的位置 + 收藏地点（7 天风力条）+ 总览地图；地点页 = 地图（风浪方向叠加）→ 模型 → 日期/时间条 → 逐时表 → 潮汐；搜索页 = 搜索 + 最近查看 + 地图选点。Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#1f3a4a; --deep:#183140; --panel:#2a4a5b; --panel2:#33566a; --line:#36596b;
  --ink:#eef5f7; --muted:#9cb5c0; --dim:#7893a0;
  --accent:#19e3b1; --warn:#ffb648; --red:#ff5a5f;
  --wave:#d6e6ee; --wavebox:#2f6f9c; --tide:#6fd3e8; --tidefill:rgba(111,211,232,.18);
  --night:rgba(5,18,26,.38); --colsel:rgba(255,255,255,.20); --cellink:#0b1c24;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1000;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bars */
.top{display:flex;gap:10px;align-items:center}
.round{flex:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;position:relative}
.dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.duo{display:flex;border:1.5px solid var(--line);border-radius:24px;height:48px;margin-left:auto;background:var(--bg)}
.duo button{border:0;background:none;width:56px;display:grid;place-items:center}
.pill{flex:1;min-width:0;height:48px;border-radius:24px;border:1.5px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:4px;padding:0 6px 0 18px}
.pill b{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pill button{flex:none;border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.pill button[aria-pressed="true"] .ico{fill:var(--accent);stroke:var(--accent)}
h2.sec{font-size:22px;font-weight:600;margin:10px 0 0;display:flex;justify-content:space-between;align-items:baseline}
h2.sec button{border:0;background:none;color:var(--accent);font-size:15px;font-weight:600}

/* home cards */
.hcard{background:var(--deep);border-radius:14px;overflow:hidden}
.loc{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:18px;font-weight:600}
.loc .ico{color:var(--ink)}
.loc button{margin-left:auto;border:0;background:none;color:var(--muted)}
.wx{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));text-align:center;padding:14px 8px 6px}
.wx .d{font-family:var(--display);font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.wx svg{width:34px;height:34px;margin:6px auto 2px;display:block}
.wx .t{font-family:var(--display);font-size:22px;font-weight:600}
.wx .t small{font-size:15px;color:var(--muted)}
.windstrip{display:flex;align-items:center;gap:8px;padding:6px 16px 14px}
.windstrip .ws-ico{flex:none;color:var(--muted);width:20px;height:20px}
.strip{flex:1;display:flex;gap:3px;height:12px;min-width:0}
.strip i{flex:1;min-width:0;height:100%}
.strip i:first-child{border-radius:6px 0 0 6px}
.strip i:last-child{border-radius:0 6px 6px 0}
.daylab{display:flex;gap:3px;padding:0 16px 12px 44px}
.daylab span{flex:1;min-width:0;text-align:center;font-family:var(--display);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;letter-spacing:.03em}
.daylab span.we{color:var(--ink)}
.daylab svg{width:7px;height:10px;margin-right:1px;vertical-align:0}
.fav{display:block;width:100%;text-align:left;border:0;background:var(--panel);border-radius:14px;padding:0;color:inherit}
.fav .nm{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 6px;font-size:19px;font-weight:600;line-height:1.25}
.fav .nm .pin{flex:none;color:var(--accent);margin-top:1px}
.fav .nm .now{margin-left:auto;font-family:var(--display);font-size:17px;color:var(--muted);white-space:nowrap;font-weight:600}
.fav .nm .now b{font-size:22px}
.favs{display:flex;flex-direction:column;gap:10px}
.favrow{display:flex;gap:8px;align-items:stretch}
.favrow .fav{flex:1;min-width:0}
.edit{display:flex;flex-direction:column;gap:6px;justify-content:center}
.edit button{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel);display:grid;place-items:center}
.edit button.x{color:var(--red)}
.mapbox{position:relative;border-radius:14px;overflow:hidden;background:var(--deep)}
.mapbox .map{height:240px}
.mapbtn{position:absolute;right:10px;bottom:10px;z-index:500;width:40px;height:40px;border-radius:12px;border:0;background:rgba(24,49,64,.85);display:grid;place-items:center}
.nomap{display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:13px;min-height:160px}
.empty{background:var(--deep);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
.cta{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--cellink);font-weight:600;border-radius:12px;padding:10px 16px}

/* spot view */
.spotmap{position:relative;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));background:var(--deep)}
.spotmap .map{height:300px;transition:height .25s}
.spotmap.big .map{height:68vh}
.ro{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;display:flex;gap:12px;align-items:center;background:rgba(24,49,64,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;padding:8px 12px;font-family:var(--display);flex-wrap:wrap;pointer-events:none}
.ro .t{font-size:20px;font-weight:700}
.ro .k{font-size:13px;color:var(--muted);font-family:var(--body)}
.ro b{font-size:20px}
.ro .sail{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--accent)}
.ro .sail svg{width:17px;height:22px}
.spotmap .mapbtn{bottom:auto;top:12px;right:max(12px,env(safe-area-inset-right,0px))}
.compassonly{display:grid;place-items:center;height:300px}
.leaflet-container{background:#aad3df;font-family:var(--body)}
.leaflet-tile-pane{filter:saturate(.45) brightness(.92) contrast(.95)}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.6)!important}
.leaflet-control-attribution a{color:#123!important}
.leaflet-control-zoom{display:none}
.ovl{pointer-events:none}
.mlabel{background:rgba(24,49,64,.92);color:var(--ink);border-radius:999px;padding:3px 10px 3px 6px;font-family:var(--display);font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.3);transform:translate(-14px,-50%)}
.mlabel i{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff}
.pickpin{width:28px;height:28px;margin:-28px 0 0 -14px}

.models{display:flex;gap:4px;background:var(--deep);border-radius:14px;padding:5px;overflow-x:auto;scrollbar-width:none}
.models button{flex:none;border:0;background:transparent;border-radius:10px;padding:9px 14px;font-weight:600;color:var(--ink);white-space:nowrap}
.models button[aria-pressed="true"]{background:var(--accent);color:var(--cellink)}
.daytabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(52px,1fr);overflow-x:auto;scrollbar-width:none}
.daytabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;padding:4px 0;color:var(--muted);font-family:var(--display);font-weight:600;line-height:1.1}
.daytabs button .w{font-size:16px}
.daytabs button .n{font-size:22px}
.daytabs button.we{color:var(--ink)}
.daytabs button[aria-pressed="true"]{color:var(--accent)}
.daytabs button.far .n{opacity:.7}
.timeline{position:relative;height:22px;margin:4px 6px 0;cursor:pointer;touch-action:pan-y}
.timeline .bar{position:absolute;inset:6px 0;border-radius:6px}
.timeline .win{position:absolute;top:2px;bottom:2px;border:3px solid #fff;border-radius:9px;background:rgba(255,255,255,.25);pointer-events:none;min-width:22px;transform:translateX(-50%)}
.tlnote{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:2px 6px 0}
.sheetbox{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.sheetwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.sheetwrap{background:var(--bg)}
table.sheet{border-collapse:separate;border-spacing:0;font-family:var(--body);font-variant-numeric:tabular-nums lining-nums}
.sheet th,.sheet td{padding:0;text-align:center;white-space:nowrap}
.sheet td{min-width:37px;width:37px;height:34px;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink)}
.sheet th.lab{position:sticky;left:0;z-index:3;background:var(--bg);font-size:12px;font-weight:500;color:#cfdde3;text-align:center;width:56px;min-width:56px;max-width:56px;border-right:1px solid var(--line);padding:0 2px;white-space:nowrap;line-height:1.1;box-shadow:6px 0 8px -6px rgba(0,0,0,.35)}
.sheet th.lab small{display:block;color:var(--dim);font-size:10.5px;font-weight:400;margin-top:1px}
.sheet tr.date th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 0 5px;letter-spacing:.08em}
.sheet tr.date th:not(.lab){border-left:1px solid var(--line)}
.sheet tr.date th span{position:sticky;left:62px;padding-left:8px}
.sheet tr.hr td{font-size:15px;font-weight:700;height:34px;background:var(--panel)}
.sheet tr.hr td.night{background:#16303d;color:#dfe9ee}
.sheet td.d0{border-left:1px solid var(--line)}
.sheet td.col{box-shadow:inset 0 0 0 999px var(--colsel)}
.sheet tr.hr td.col{background:#6f8e9c;border-radius:10px 10px 0 0;box-shadow:none}
.sheet tr.last td.col{border-radius:0 0 10px 10px}
.sheet td.c{color:var(--cellink);font-weight:600;height:34px}
.sheet td.s{color:#dbe6ea}
.sheet tr.gap>*{border-top:1px solid var(--line)}
.sheet tr.gap td,.sheet tr.gap th{height:40px}
.sheet td.sail{font-size:11.5px;line-height:1;height:44px;color:#dbe6ea}
.sheet td.sail svg{display:block;margin:2px auto 0;width:17px;height:22px}
.sheet td.sail .ov{color:var(--red)}
.arr{display:inline-block;width:20px;height:20px;vertical-align:middle}
.arr svg{display:block}
.wbox{display:inline-grid;place-items:center;width:31px;height:22px;background:var(--wavebox);color:#fff;border-radius:7px}
.mk{display:block;font-size:9.5px;letter-spacing:-.2px;line-height:1;color:var(--tide);font-weight:600;margin-bottom:2px}
.tval{font-size:13px}
.card{background:var(--deep);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.card h2 b{color:var(--ink)}
.tidelist{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.tl{background:var(--panel);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.tl .k{font-size:12px;color:var(--muted)}
.tl .v{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.tl .h{font-family:var(--display);font-size:14px;color:var(--muted)}
.meta{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.meta .sun{display:flex;gap:18px;font-family:var(--display);font-size:17px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.banner{background:var(--panel);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.banner b{color:var(--warn)}
.foot{font-size:12px;color:var(--dim);line-height:1.6}
.foot a{color:inherit}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.legend{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.legend i{flex:1}
.legendlab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-family:var(--display)}

/* search view */
.sbar{display:flex;gap:10px;align-items:center}
.sbar input{flex:1;min-width:0;height:48px;border-radius:24px;border:1.5px solid var(--line);background:var(--bg);padding:0 20px;font-size:17px}
.sbar input::placeholder{color:var(--dim)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;padding:10px 0;font-size:17px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.rlist{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;gap:1px;background:var(--line)}
.ritem{display:flex;align-items:center;gap:14px;background:var(--panel);border:0;padding:14px 16px;text-align:left;width:100%}
.ritem .ico{color:var(--muted);flex:none}
.ritem span{flex:1;min-width:0}
.ritem b{display:block;font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem small{color:var(--muted);font-size:14px}
.ritem .add{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;background:none}
.ritem .add[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.rhead b{font-size:20px}
.rhead button{border:0;background:none;color:var(--muted)}
.msg{font-size:14px;color:var(--warn);padding:4px 2px}

/* pick view */
.pickwrap{position:fixed;inset:0;z-index:50;background:var(--bg)}
.pickwrap .map{position:absolute;inset:0}
.pickbar{position:absolute;z-index:600;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center}
.pickbar .hint{flex:1;background:rgba(24,49,64,.9);border-radius:24px;padding:12px 18px;font-size:15px}
.picksheet{position:absolute;z-index:600;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--deep);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.picksheet .row{display:flex;gap:8px}
.picksheet input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{border:0;background:var(--accent);color:var(--cellink);font-weight:600;border-radius:12px;padding:11px 16px}
.btn.ghost{background:var(--panel);color:var(--ink);font-weight:500}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,14,20,.6);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.drawer{background:var(--deep);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.drawer h3{margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.drawer h3 button{border:0;background:var(--panel);border-radius:10px;padding:6px 14px;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.field .hint{font-size:12px;color:var(--dim)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 6px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--cellink);font-weight:600}
.rowed{display:flex;flex-direction:column;background:var(--panel);border-radius:12px;overflow:hidden}
.rrow{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow span{flex:1}
.rrow .mv{border:0;background:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.rrow .mv:disabled{opacity:.25}
.sw{flex:none;width:44px;height:26px;border-radius:13px;border:0;background:var(--line);position:relative;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{left:21px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 18px;z-index:3000;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

<div id="vHome" class="wrap"></div>
<div id="vSpot" class="wrap" hidden></div>
<div id="vSearch" class="wrap" hidden></div>
<div id="vPick" hidden></div>
<div id="layer"></div>

<script>
const SNAPSHOT = /*SNAPSHOT*/null;
(function(){
"use strict";
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEF_FAVS=[{name:"Long Reef Headland",lat:-33.7418,lon:151.3222},{name:"Botany Bay（Dolls Point）",lat:-33.9935,lon:151.1495},{name:"Kurnell（Silver Beach）",lat:-34.0048,lon:151.2016}];
let favs=store.get("wr5.favs",DEF_FAVS);
let recent=store.get("wr5.recent",[]);

/* ---------- sail size ---------- */
function sailFor(kn){
  if(kn==null)return{v:null};
  const k={safe:0.88,std:1,bold:1.12}[cfg.style]||1;
  let s=1.34*cfg.weight/Math.max(kn,0.1)*k;
  const q=String(cfg.quiver||"").split(/[,，\s]+/).map(Number).filter(x=>x>0).sort((a,b)=>a-b);
  if(s>cfg.maxSail*1.08)return{v:null,low:true};
  if(s<cfg.minSail*0.85)return{v:null,high:true};
  s=Math.max(cfg.minSail,Math.min(cfg.maxSail,s));
  if(q.length){let best=q[0];for(const x of q)if(Math.abs(x-s)<Math.abs(best-s))best=x;return{v:best,own:true}}
  return{v:Math.round(s*10)/10};
}

/* ---------- tide harmonic analysis ---------- */
const CONS=[28.9841042,30.0,28.4397295,15.0410686,13.9430356,13.3986609,57.9682084,58.9841042,57.4238337,27.8953548,27.9682084,28.5125831,29.5284789,86.9523127];
function fitTide(ts,vs){
  const pts=[];for(let i=0;i<ts.length;i++)if(vs[i]!=null)pts.push([ts[i],vs[i]]);
  if(pts.length<24*20)return null;
  const t0=pts.reduce((s,p)=>s+p[0],0)/pts.length;
  const w=CONS.map(c=>c*Math.PI/180);const n=1+2*w.length;
  const A=Array.from({length:n},()=>new Float64Array(n)),b=new Float64Array(n),row=new Float64Array(n);
  for(const[t,y]of pts){const tt=t-t0;row[0]=1;w.forEach((wi,j)=>{row[1+2*j]=Math.cos(wi*tt);row[2+2*j]=Math.sin(wi*tt)});
    for(let i=0;i<n;i++){b[i]+=row[i]*y;const ri=row[i],Ai=A[i];for(let k=0;k<n;k++)Ai[k]+=ri*row[k]}}
  for(let i=0;i<n;i++)A[i][i]+=1e-6;
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];
    for(let r=c+1;r<n;r++){const f=A[r][c]/A[c][c];if(!f)continue;for(let k=c;k<n;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c]}}
  const x=new Float64Array(n);for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=A[r][k]*x[k];x[r]=s/A[r][r]}
  return {h:t=>{const tt=t-t0;let s=0;for(let j=0;j<w.length;j++)s+=x[1+2*j]*Math.cos(w[j]*tt)+x[2+2*j]*Math.sin(w[j]*tt);return s}};
}
function extrema(f,a,b){const out=[];const dt=0.1;let p=f(a-dt),c=f(a);for(let t=a;t<=b;t+=dt){const nx=f(t+dt);if(c>p&&c>=nx)out.push({t,hi:true});else if(c<p&&c<=nx)out.push({t,hi:false});p=c;c=nx}
  return out.map(e=>{const y0=f(e.t-dt),y1=f(e.t),y2=f(e.t+dt);const d=(y0-2*y1+y2);const off=d?0.5*(y0-y2)/d*dt:0;return{t:e.t+off,h:f(e.t+off),hi:e.hi}})}

function normalize(raw){
  const {fc,mr,td}=raw;const H=fc.hourly,M=mr.hourly;

  const pick=(k,i)=>{if(i==null)return null;const a=M[k+"_marine_best_match"]??M[k];const g=M[k+"_ncep_gfswave025"];const v=a?a[i]:null;return v!=null?v:(g?g[i]:null)};
  const hours=H.time.map((t,i)=>{const j=mIdx.get(t);
    return{t,th:parseT(t),date:t.slice(0,10),hh:+t.slice(11,13),ws:H.wind_speed_10m[i],wg:H.wind_gusts_10m[i],wd:H.wind_direction_10m[i],temp:H.temperature_2m[i],pr:H.precipitation[i],pp:H.precipitation_probability?H.precipitation_probability[i]:null,
      wh:pick("wave_height",j),wdir:pick("wave_direction",j),wp:pick("wave_period",j),sh:pick("swell_wave_height",j),sd:pick("swell_wave_direction",j),sp:pick("swell_wave_period",j),sst:pick("sea_surface_temperature",j)}}).filter(h=>h.ws!=null);
  if(raw.cmp){const ix=new Map(H.time.map((t,i)=>[t,i]));CMP.forEach(([k])=>{const c=raw.cmp[k];if(!c)return;const cm=new Map(c.hourly.time.map((t,i)=>[t,c.hourly.wind_speed_10m[i]]));hours.forEach(h=>{(h.cmp=h.cmp||{})[k]=cm.get(h.t)??null})})}
  const sun={};fc.daily.time.forEach((d,i)=>sun[d]={rise:fc.daily.sunrise[i],set:fc.daily.sunset[i]});
  fit=td?fitTide(td.hourly.time.map(parseT),td.hourly.sea_level_height_msl):null;
  if(fit)hours.forEach(h=>h.tide=fit.h(h.th));
  const dates=[...new Set(hours.map(h=>h.date))];
  const tideX=fit?extrema(fit.h,hours[0].th,hours[hours.length-1].th+1):[];
  return{hours,sun,dates,tideX,tz:fc.timezone};
}

function stripHTML(m){

  const today=localDateIn(m.tz);
  const labs=m.days.map(d=>{const w=wk(d.date);return`<span class="${w===0||w===6?"we":""}">${d.rain>=1?`<span style="color:var(--tide)">${I.drop}</span>`:""}${d.date===today?"今天":"周"+WK[w]}</span>`}).join("");
  return`<div class="windstrip">${I.wind}<div class="strip">${segs}</div></div><div class="daylab">${labs}</div>`;
}

  if(m){lastRes=[{name:`${(+m[1]).toFixed(3)}, ${(+m[2]).toFixed(3)}`,lat:+m[1],lon:+m[2]}]}
  else{box.innerHTML='<div class="note">搜索中…</div>';
    try{const r=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=zh&format=json`);

const CMP=[["ecmwf_ifs025","ECMWF"],["gfs_seamless","GFS"],["icon_seamless","ICON"]];
async function fetchRaw(s,m){
  const base=m==="compare"?"best_match":m;const u=urls(s,base);
  try{const[fc,mr,td]=await Promise.all([getJSON(u.fc),getJSON(u.mr),getJSON(u.td).catch(()=>null)]);
    let cmp=null;if(m==="compare"){cmp={};await Promise.all(CMP.map(async([k])=>{try{cmp[k]=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=wind_speed_10m&forecast_days=16&wind_speed_unit=kn&timezone=auto&models=${k}&cell_selection=sea`)}catch(e){}}))}
    online=true;return{raw:{fc,mr,td,cmp},mode:"live"}}
  catch(e){if(online==null)online=false}
  if(SNAPSHOT&&sameSpot(SNAPSHOT.spot,s)){const cmp=m==="compare"?Object.fromEntries(CMP.map(([k])=>[k,SNAPSHOT.fc[k]])):null;
    return{raw:{fc:SNAPSHOT.fc[base]||SNAPSHOT.fc.best_match,mr:SNAPSHOT.mr,td:SNAPSHOT.td,cmp,fetched:SNAPSHOT.fetched},mode:"snap"}}
  return{raw:null}
}
async function loadSpot(){
  const seq=++loadSeq;const r=await fetchRaw(cur,model);const raw=r.raw,mode=r.mode;
  if(seq!==loadSeq)return;
  if(!raw){$("#app").innerHTML=`<div class="banner"><b>载入失败</b>。${online===false?"当前环境不能联网，只有 Long Reef 有离线数据。放到 GitHub Pages 上即可查看任何地点。":"请检查网络后重试。"}</div>`;renderSpotMap();return}
  data=normalize(raw);
  const n=nowTh(data.tz);let i=data.hours.findIndex(h=>h.th>=n-0.5);selI=i<0?0:i;
  $("#banner").innerHTML=mode==="snap"?`<div class="banner"><b>离线快照</b>，抓取于 ${new Date(raw.fetched).toLocaleString("zh-CN",{timeZone:"Australia/Sydney",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}（悉尼时间）。当前环境不能联网。</div>`:"";
  renderSpotMap();renderSpot(true);
}
function overlaySVG(h){
  const C=90,R=56;
  const band=(deg,color,len,wid,off,label)=>{if(deg==null)return"";
    return`<g transform="rotate(${deg} ${C} ${C})"><rect x="${C-wid/2+off}" y="${C-R-26}" width="${wid}" height="${len}" rx="${wid/2}" fill="${color}" stroke="rgba(0,0,0,.25)" stroke-width="1"/><path d="M${C+off} ${C-R-26+len+9} l-${wid/2} -10 h${wid} z" fill="${color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/></g>`};
  let ticks="";for(let i=0;i<36;i++){const a=i*10*Math.PI/180,r2=i%9===0?R-7:R-3;ticks+=`<line x1="${C+Math.sin(a)*R}" y1="${C-Math.cos(a)*R}" x2="${C+Math.sin(a)*r2}" y2="${C-Math.cos(a)*r2}" stroke="rgba(20,40,52,.55)" stroke-width="${i%9===0?2:1}" stroke-linecap="round"/>`}
  return`<svg viewBox="0 0 180 180" width="180" height="180"><circle cx="${C}" cy="${C}" r="${R}" fill="rgba(255,255,255,.18)" stroke="rgba(20,40,52,.45)" stroke-width="1.2"/>${ticks}
    <text x="${C}" y="${C-R+16}" text-anchor="middle" font-size="13" font-weight="700" fill="#e0353b" font-family="Barlow Condensed,sans-serif">N</text>
    ${band(h.wdir,"#9fd0ef",58,14,7)}${band(h.wd,windColor(h.ws),64,18,-8)}<circle cx="${C}" cy="${C}" r="4.5" fill="#183140" stroke="#fff" stroke-width="2"/></svg>`;
}

function roHTML(h){const s=sailFor(h.ws);

    <span><b style="color:${windColor(h.ws)}">${wv(h.ws)}</b> <span class="k">${wu()} ${dirName(h.wd)}</span></span><span><b>${f1(h.wh)}</b> <span class="k">米 ${f1(h.wp)}秒</span></span>
    <span class="sail">${s.v?sailSvg(s.v)+`<b style="color:${sailColor(s.v)}">${s.v}</b><span class="k">m²</span>`:`<span class="k">${s.low?"风太小":"风太大"}</span>`}</span></div>`}
function updateOverlay(){if(!data)return;const h=data.hours[selI];if(spotOvl)spotOvl.setIcon(L.divIcon({className:"ovl",html:overlaySVG(h),iconSize:[180,180],iconAnchor:[90,90]}));
  const rb=$("#roBox");if(rb)rb.innerHTML=roHTML(h);else if(!spotMap){const b=$("#spotMapBox");if(b)b.innerHTML=`<div class="compassonly" style="background:var(--deep)">${overlaySVG(h)}</div>${roHTML(h)}`}}

function shownHours(){return data.hours.filter(h=>h.hh%cfg.step===0)}
function snapSel(){const hs=data.hours;if(cfg.step>1){let i=selI;while(i>0&&hs[i].hh%cfg.step)i--;selI=i}}
function renderSpot(scroll){
  snapSel();const d=data,h=d.hours[selI],today=localDateIn(d.tz);
  let html=`<div class="models" role="group" aria-label="风的预报模型">${MODELS.map(([k,l])=>`<button type="button" data-m="${k}" aria-pressed="${k===model}">${l}</button>`).join("")}</div>`;
  html+=`<div><div class="daytabs" id="days">${d.dates.map((dt,i)=>{const w=wk(dt);return`<button type="button" data-d="${dt}" class="${w===0||w===6?"we":""}${i>=7?" far":""}" aria-pressed="${dt===h.date}"><span class="w">${dt===today?"今天":"周"+WK[w]}</span><span class="n">${dt.slice(8)}</span></button>`}).join("")}</div>`;
  const stops=d.hours.map((x,i)=>`${windColor(x.ws)} ${(i/(d.hours.length-1)*100).toFixed(2)}%`).join(",");
  html+=`<div class="timeline" id="tl"><div class="bar" style="background:linear-gradient(90deg,${stops})"></div><div class="win" style="left:${(selI/(d.hours.length-1)*100).toFixed(2)}%;width:${Math.max(22,100/d.hours.length*24)}px"></div></div>
    <div class="tlnote"><span>拖动或点击色条选择时间</span><span>第 8 天以后只看趋势</span></div></div>`;
  html+=sheet()+tideCard(h.date)+metaCard(h.date);
  $("#app").innerHTML=html;updateOverlay();
  if(scroll)scrollToSel();
}
function sheet(){
  const d=data,hs=shownHours(),sel=d.hours[selI];
  const groups=[];hs.forEach(h=>{const g=groups[groups.length-1];if(g&&g.date===h.date)g.n++;else groups.push({date:h.date,n:1})});
  const isNight=h=>{const s=d.sun[h.date];if(!s)return false;return h.hh<+s.rise.slice(11,13)||h.hh>+s.set.slice(11,13)};
  const tideMarks=new Map();d.tideX.forEach(x=>{const k=Math.round(x.t/cfg.step)*cfg.step;tideMarks.set(k,x)});
  // 相邻格子颜色渐变过渡，读起来像连续的风场
  const grad=get=>(h,i)=>{const c=get(h);if(c==null)return"";const p=i>0?get(hs[i-1]):c,n=i<hs.length-1?get(hs[i+1]):c;
    return`background:linear-gradient(90deg,${windColor(((p??c)+c)/2)},${windColor(c)} 50%,${windColor(((n??c)+c)/2)})`};
  const rainBar=h=>{if(!h.pr)return"";const p=Math.round(Math.min(1,0.15+h.pr/4)*80);return`background:linear-gradient(to top,rgba(74,166,232,.55) ${p}%,transparent ${p}%)`};
  const L=(a,u)=>`${a}${u?`<small>${u}</small>`:""}`;
  const R={
    sail:["sail",L("帆","m²"),h=>{const s=sailFor(h.ws);return s.v?`${s.v}${sailSvg(s.v)}`:s.high?`<span class="ov">风大</span>`:"–"}],
    wd:["",L("风向"),h=>arrow(h.wd,18)],
    ws:["c",L("风速",wu()),h=>wv(h.ws),grad(h=>h.ws)],
    wg:["c",L("阵风",wu()),h=>wv(h.wg),grad(h=>h.wg)],
    temp:["s",L("气温","°C"),h=>f0(h.temp)+"°"],
    pr:["s",L("降水","毫米"),h=>h.pr?f1(h.pr):"0",rainBar],
    pp:["s",L("雨概率","%"),h=>h.pp==null?"–":h.pp],
    sst:["s",L("水温","°C"),h=>h.sst==null?"–":f0(h.sst)+"°"],
    wdir:["",L("浪向"),h=>h.wdir==null?"–":`<span class="wbox">${arrow(h.wdir,15)}</span>`],
    wh:["",L("浪高","米"),h=>f1(h.wh)],
    wp:["s",L("周期","秒"),h=>f1(h.wp)],
    sh:["s",L("涌浪","米"),h=>f1(h.sh)],
    sd:["",L("涌向"),h=>arrow(h.sd,16)],
    sp:["s",L("涌周期","秒"),h=>f1(h.sp)],
    tide:["tval",L("潮位","米"),h=>{const m=tideMarks.get(h.th);return(m?`<span class="mk">${m.hi?"▲":"▼"}${fmtHM(m.t)}</span>`:"")+`${h.tide>=0?"+":""}${h.tide.toFixed(1)}`}]};
  const rows=[["hr","",h=>String(h.hh).padStart(2,"0")]];let gapDone=false;
  rowCfg().forEach(x=>{if(!x.on)return;if(x.k==="tide"&&!d.tideX.length)return;const r=R[x.k].slice();
    if(["wdir","wh","wp","sh","sd","sp","tide"].includes(x.k)&&!gapDone){gapDone=true;if(rows.length>1)r[0]=(r[0]?r[0]+" ":"")+"gap"}
    rows.push(r);
    if(x.k==="wg"&&model==="compare")CMP.forEach(([k,l])=>rows.push(["c",L(l,wu()),h=>wv(h.cmp&&h.cmp[k]),grad(h=>h.cmp?h.cmp[k]:null)]))});
  let s=`<div class="sheetbox"><div class="sheetwrap" id="sheet"><table class="sheet"><tbody><tr class="date"><th class="lab">${cfg.step===1?"逐 1 小时":"逐 3 小时"}</th>`;
  groups.forEach(g=>s+=`<th colspan="${g.n}"><span>周${WK[wk(g.date)]} · ${+g.date.slice(5,7)}月${+g.date.slice(8)}日</span></th>`);s+="</tr>";
  rows.forEach((r,ri)=>{const[c,label,fn,st]=r;
    const isGap=/\bgap\b/.test(c),base=c.replace(/\bgap\b/,"").trim();
    s+=`<tr class="${c==="hr"?"hr":""}${isGap?" gap":""}${ri===rows.length-1?" last":""}"><th class="lab">${label}</th>`;
    hs.forEach((h,i)=>{const cl=[c==="hr"?"":base];if(i===0||hs[i-1].date!==h.date)cl.push("d0");if(c==="hr"&&isNight(h))cl.push("night");if(h.th===sel.th)cl.push("col");
      const sty=st?st(h,i):"";s+=`<td data-th="${h.th}" class="${cl.join(" ")}"${sty?` style="${sty}"`:""}>${fn(h)}</td>`});s+="</tr>"});
  return s+"</tbody></table></div></div>";
}
function tideCard(day){
  if(!fit)return`<div class="card"><h2>潮汐</h2><div class="note">这个地点没有可用的海平面数据，无法推算潮汐。</div></div>`;
  const ex=data.tideX.filter(x=>dayKey(x.t)===day);
  return`<div class="card"><h2>潮汐 · <b>周${WK[wk(day)]} ${+day.slice(5,7)}月${+day.slice(8)}日</b></h2>${tideSVG(day)}
    <div class="tidelist">${ex.map(x=>`<div class="tl"><span class="k">${x.hi?"高潮":"低潮"}</span><span class="v">${fmtHM(x.t)}</span><span class="h">${x.h>=0?"+":""}${x.h.toFixed(2)} 米</span></div>`).join("")}</div>
    <div class="note">高度相对平均海平面。看潮池、走礁石选低潮前后 1–2 小时。</div></div>`;
}
function tideSVG(day){
  const W=Math.round(Math.max(320,Math.min(680,($("#vSpot")?.clientWidth||680)-60))),Hh=170,pl=34,pr=8,pt=22,pb=24;const t0=parseT(day+"T00:00"),t1=t0+24;
  const f=fit.h;const pts=[];for(let t=t0;t<=t1+1e-9;t+=0.25)pts.push([t,f(t)]);
  const all=data.tideX.map(x=>x.h);const gmn=Math.min(...all,-0.8)-0.05,gmx=Math.max(...all,0.8)+0.05;
  const x=t=>pl+(t-t0)/24*(W-pl-pr),y=v=>pt+(gmx-v)/(gmx-gmn)*(Hh-pt-pb);
  const s=data.sun[day];let night="";
  if(s){const r=parseT(s.rise),st=parseT(s.set);night=`<rect x="${pl}" y="${pt}" width="${x(r)-pl}" height="${Hh-pt-pb}" fill="var(--night)"/><rect x="${x(st)}" y="${pt}" width="${W-pr-x(st)}" height="${Hh-pt-pb}" fill="var(--night)"/>`}
  const path="M"+pts.map(p=>x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join(" L");
  let g="";for(let hh=0;hh<=24;hh+=3)g+=`<text x="${x(t0+hh)}" y="${Hh-6}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Barlow Condensed,sans-serif">${String(hh).padStart(2,"0")}</text>`;
  [-1,-0.5,0,0.5,1].filter(v=>v>=gmn&&v<=gmx).forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===0?"":"2 4"}"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="Barlow Condensed,sans-serif">${v>0?"+":""}${v}</text>`);
  let mk="";data.tideX.filter(e=>e.t>=t0&&e.t<t1).forEach(e=>{const X=x(e.t),Y=y(e.h);mk+=`<circle cx="${X}" cy="${Y}" r="4.5" fill="var(--tide)" stroke="var(--deep)" stroke-width="2"/><text x="${Math.min(Math.max(X,pl+18),W-pr-18)}" y="${e.hi?Y-10:Y+19}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="Barlow Condensed,sans-serif">${fmtHM(e.t)}</text>`});
  const sel=data.hours[selI];let sl="";if(sel.date===day)sl=`<line x1="${x(sel.th)}" x2="${x(sel.th)}" y1="${pt-6}" y2="${Hh-pb}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>`;
  return`<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="display:block" role="img" aria-label="当日潮汐曲线">${night}${g}<path d="${path} L${x(t1)} ${Hh-pb} L${x(t0)} ${Hh-pb} Z" fill="var(--tidefill)"/><path d="${path}" fill="none" stroke="var(--tide)" stroke-width="2.5" stroke-linecap="round"/>${mk}${sl}</svg>`;
}
function metaCard(day){
  const s=data.sun[day];const ml=MODELS.find(m=>m[0]===model)[1];
  return`<div class="card"><div class="meta">${s?`<div class="sun"><span>日出 ${s.rise.slice(11)}</span><span>日落 ${s.set.slice(11)}</span></div>`:""}
  <div>风的预报模型：<b style="color:var(--ink)">${ml}</b>。${model==="compare"?"表格里同时列出 ECMWF、GFS、ICON 的风速，几个模型越接近，预报越可信。":"不同模型数值会有差异，可以选“模型对比”一起看。"}</div>
  <div class="legend">${[0,4,8,11,15,18,22,26,31,40].map(k=>`<i style="background:${windColor(k)}"></i>`).join("")}</div>
  <div class="legendlab"><span>0</span><span>8</span><span>15</span><span>22</span><span>31</span><span>40+ 节</span></div></div></div>`;
}
function scrollToSel(){const wrap=$("#sheet");const td=wrap&&wrap.querySelector("td.col");if(td)wrap.scrollLeft=Math.max(0,td.offsetLeft-62-td.offsetWidth*1.5);
  const b=document.querySelector(`#days button[aria-pressed="true"]`),ds=$("#days");if(b&&ds)ds.scrollLeft=Math.max(0,b.offsetLeft-ds.clientWidth/2+b.clientWidth/2)}
function select(i,scroll){selI=Math.max(0,Math.min(data.hours.length-1,i));const sx=$("#sheet")?.scrollLeft;renderSpot(false);if(scroll)scrollToSel();else if(sx!=null)$("#sheet").scrollLeft=sx}

/* ---------- settings drawer ---------- */
function openDrawer(html,onMount){$("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="drawer" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim"||e.target.closest("[data-close]"))closeDrawer()});onMount&&onMount()}
function closeDrawer(){$("#layer").innerHTML=""}
function setDrawer(){
  const seg=(id,opts,val)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(v)===String(val)}">${l}</button>`).join("")}</div>`;
  openDrawer(`<h3>设置<button type="button" data-close>完成</button></h3>
    <div class="field"><label>帆板：你的体重（公斤）</label><input id="weight" type="number" inputmode="decimal" min="30" max="150" step="1" value="${cfg.weight}"><div class="hint">建议帆按经验公式估算：帆面积 ≈ 1.34 × 体重 ÷ 风速（节）。</div></div>
    <div class="two"><div class="field"><label>最小的帆（m²）</label><input id="minSail" type="number" inputmode="decimal" step="0.1" value="${cfg.minSail}"></div><div class="field"><label>最大的帆（m²）</label><input id="maxSail" type="number" inputmode="decimal" step="0.1" value="${cfg.maxSail}"></div></div>
    <div class="field"><label>我有的帆（可选，用逗号分隔）</label><input id="quiver" type="text" placeholder="例如 4.7, 5.8, 7.0, 8.5" value="${esc(cfg.quiver)}"><div class="hint">填了以后，建议会直接选你手上最接近的那张帆。</div></div>
    <div class="field"><label>风格</label>${seg("style",[["safe","保守"],["std","标准"],["bold","激进"]],cfg.style)}</div>
    <div class="field"><label>风速单位</label>${seg("unit",[["kn","节"],["ms","米/秒"],["kmh","公里/时"]],cfg.unit)}</div>
    <div class="field"><label>表格时间间隔</label>${seg("step",[[1,"逐 1 小时"],[3,"逐 3 小时"]],cfg.step)}</div>
    <div class="field"><label style="display:flex;justify-content:space-between;align-items:center">表格显示的项目<button type="button" id="rowReset" style="border:0;background:none;color:var(--accent);font-size:13px">恢复默认</button></label><div class="rowed" id="rowEd"></div><div class="hint">打开或关闭开关来显示、隐藏一行，用箭头调整顺序。</div></div>`,()=>{
    const ed=()=>{const r=rowCfg();$("#rowEd").innerHTML=r.map((x,i)=>{const n=ROWDEF.find(d=>d[0]===x.k)[1];return`<div class="rrow"><button type="button" class="sw" data-tog="${i}" role="switch" aria-checked="${x.on}" aria-label="${n}"><i></i></button><span>${n}</span><button type="button" class="mv" data-mv="${i}" data-dir="-1" aria-label="上移" ${i===0?"disabled":""}>${I.up}</button><button type="button" class="mv" data-mv="${i}" data-dir="1" aria-label="下移" ${i===r.length-1?"disabled":""}>${I.down}</button></div>`}).join("")};
    ed();
    $("#rowEd").onclick=e=>{const r=rowCfg();const tg=e.target.closest("[data-tog]"),mv=e.target.closest("[data-mv]");
      if(tg){const i=+tg.dataset.tog;r[i].on=!r[i].on}else if(mv){const i=+mv.dataset.mv,j=i+ +mv.dataset.dir;if(j<0||j>=r.length)return;[r[i],r[j]]=[r[j],r[i]]}else return;cfg.rows=r;ed();save()};
    $("#rowReset").onclick=()=>{delete cfg.rows;ed();save()};
    const num=(id,min,max)=>{const el=$("#"+id);el.addEventListener("change",()=>{let v=parseFloat(el.value);if(!isFinite(v))v=cfg[id];v=Math.max(min,Math.min(max,v));el.value=v;cfg[id]=v;if(id==="weight")cfg.weightSet=true;if(cfg.minSail>cfg.maxSail){[cfg.minSail,cfg.maxSail]=[cfg.maxSail,cfg.minSail]}save()})};
    num("weight",30,150);num("minSail",1,13);num("maxSail",1,13);
    $("#quiver").addEventListener("change",e=>{cfg.quiver=e.target.value;save()});
    ["style","unit","step"].forEach(id=>$("#"+id).addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;cfg[id]=id==="step"?+b.dataset.v:b.dataset.v;$("#"+id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));save()}));
  });
  function save(){store.set("wr.cfg",cfg);if(!$("#vSpot").hidden&&data)select(selI,true);if(!$("#vHome").hidden){renderFavs();const d=$("#hMenu .dot");if(d&&cfg.weightSet)d.remove()}}
}

/* ---------- spot page events ---------- */
document.addEventListener("click",e=>{
  if($("#vSpot").hidden||!data)return;
  const m=e.target.closest("#app [data-m]");if(m){if(m.dataset.m!==model){model=m.dataset.m;store.set("wr5.model",model);const th=data.hours[selI].th;
    const seq=++loadSeq;fetchRaw(cur,model)
      .then(({raw})=>{if(!raw||seq!==loadSeq)return;data=normalize(raw);const i=data.hours.findIndex(h=>h.th===th);selI=i<0?0:i;renderSpot(true)})}return}
  const dbtn=e.target.closest("#days [data-d]");if(dbtn){const dt=dbtn.dataset.d;const n=nowTh(data.tz);let i=data.hours.findIndex(h=>h.date===dt&&h.hh===12);if(dt===localDateIn(data.tz)){const j=data.hours.findIndex(h=>h.th>=n-0.5);if(j>=0)i=j}if(i<0)i=data.hours.findIndex(h=>h.date===dt);select(i,true);return}
  const td=e.target.closest("#sheet td[data-th]");if(td){select(data.hours.findIndex(h=>h.th===+td.dataset.th),false);return}
});
let dragging=false;
function tlPick(e){const tl=$("#tl");if(!tl)return;const r=tl.getBoundingClientRect();const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));select(Math.round(p*(data.hours.length-1)),true)}
document.addEventListener("pointerdown",e=>{if(e.target.closest("#tl")&&data){dragging=true;tlPick(e)}});
window.addEventListener("pointermove",e=>{if(dragging)tlPick(e)});
window.addEventListener("pointerup",()=>dragging=false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});

/* ---------- start ---------- */
(function init(){
  const p=new URLSearchParams(location.search);
  if(p.get("lat")&&p.get("lon")){cur={name:p.get("name")||"分享的地点",lat:+p.get("lat"),lon:+p.get("lon")};store.set("wr5.cur",cur);history.replaceState(null,"",location.pathname+"#spot")}
  route();
})();
})();
</script>
