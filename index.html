<style>
/* Layout: a sailor's planner. Answer first (can I sail, when, which sail) → one scrubbable day chart (wind / waves / tide on one time axis) → 16-day sailing calendar → raw hourly sheet on demand. */
:root{
  --bg:#edf2f4; --surface:#ffffff; --surface2:#e2eaee; --ink:#0f2330; --muted:#5a6f7a; --line:#d2dde3;
  --accent:#e4472b; --good:#0f9f78; --goodbg:rgba(15,159,120,.13); --warn:#c77d00; --bad:#d23a3a;
  --sea:#2a7db6; --tide:#1c8aa0; --tidefill:rgba(28,138,160,.14); --night:rgba(15,35,48,.06); --cellink:#0c1d26;
  --display:"Saira Semi Condensed","Arial Narrow",-apple-system,"PingFang SC",sans-serif;
  --body:"Saira",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1820; --surface:#12232d; --surface2:#1a2f3b; --ink:#e5eff3; --muted:#8fa6b1; --line:#223945;
  --accent:#ff6a4a; --good:#2fd3a0; --goodbg:rgba(47,211,160,.14); --warn:#f2b640; --bad:#ff6b6b;
  --sea:#5aaee6; --tide:#5cc8dc; --tidefill:rgba(92,200,220,.16); --night:rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1820; --surface:#12232d; --surface2:#1a2f3b; --ink:#e5eff3; --muted:#8fa6b1; --line:#223945;
  --accent:#ff6a4a; --good:#2fd3a0; --goodbg:rgba(47,211,160,.14); --warn:#f2b640; --bad:#ff6b6b;
  --sea:#5aaee6; --tide:#5cc8dc; --tidefill:rgba(92,200,220,.16); --night:rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.head{display:flex;align-items:center;gap:10px}
.spotbtn{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column}
.spotbtn .k{font-size:12px;color:var(--muted);letter-spacing:.04em}

.icon svg{width:20px;height:20px}
.banner{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:9px 12px}

.verdict{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.vday{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.vday .nav{display:flex;gap:6px}
.vday .nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:18px;line-height:1}
.vday .nav button:disabled{opacity:.35;cursor:default}
.vtitle{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}

.calaxis{display:grid;grid-template-columns:52px minmax(0,1fr) 92px;gap:10px;padding:10px 14px 4px;font-size:11px;color:var(--muted);font-family:var(--display)}

.tidelist{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;padding:0 14px}

.sheet tr.hr td{color:var(--muted);font-weight:500}
.sheet td.n{background:var(--night)}
.sheet td.c{color:var(--cellink)}

.foot{font-size:12px;color:var(--muted);line-height:1.6}
.foot a{color:inherit}

.scrim{position:fixed;inset:0;background:rgba(5,15,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.drawer{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;box-sizing:border-box}

.field>label{font-size:13px;color:var(--muted)}

.fhint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:14px;min-width:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.srow{display:flex;gap:8px}
.srow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{border:0;background:var(--accent);color:#fff;font-weight:600;border-radius:10px;padding:10px 16px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;border:1.5px solid transparent;text-align:left;width:100%;box-sizing:border-box}
.item[aria-current="true"]{border-color:var(--good)}
.item .main{all:unset;flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column}
.item small{color:var(--muted)}

@media (max-width:420px){.vtitle{font-size:26px}.readout{gap:6px}.readout .t{font-size:24px}.ro .v{font-size:17px}.crow,.calaxis{grid-template-columns:44px minmax(0,1fr) 80px;gap:8px;padding-left:12px;padding-right:12px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>

<div class="wrap">
  <div class="head">
    <button class="spotbtn" id="spotBtn" type="button"><span class="k">地点</span><b id="spotName">Long Reef Headland</b></button>
    <button class="icon" id="setBtn" type="button" aria-label="我的帆板设置"><svg viewBox="0 0 24 24"><path d="M6 2 C14 6 19 13 18 21 L6 21 Z" fill="var(--accent)"/><rect x="3" y="21" width="18" height="2" rx="1" fill="var(--ink)"/></svg></button>
  </div>
  <div id="banner"></div>
  <div id="app"><div class="loading">正在载入预报…</div></div>
  <div class="foot">数据来源：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>（CC BY 4.0），模型包括 ECMWF、NOAA GFS 与 GFS 海浪、德国 ICON、法国 MFWAM/SMOC（哥白尼海洋服务）。浪与涌近 10 天用最佳组合模型，之后用 GFS 海浪补到 16 天。潮汐由过去 92 天的海平面数据做调和分析推算，时间误差约半小时，礁石区活动请以 <a href="http://www.bom.gov.au/australia/tides/" target="_blank" rel="noopener">澳大利亚气象局潮汐表</a> 为准。建议帆面积和“能不能滑”是根据经验公式的估算，下水前请结合现场判断。</div>
</div>
<div id="layer"></div>

<script>
const SNAPSHOT = /*SNAPSHOT*/null;
(function(){
"use strict";
const $=s=>document.querySelector(s);
const DEF={name:"Long Reef Headland",lat:-33.7418,lon:151.3222,face:90};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let spots=store.get("wr3.spots",[DEF]); if(!spots.length) spots=[DEF];
let cur=store.get("wr3.cur",spots[0]);
let model=store.get("wr3.model","best_match");
let cfg=Object.assign({weight:null,minSail:4.5,maxSail:8.5,style:"std",quiver:"",unit:"kn"},store.get("wr3.cfg",{}));
let data=null, selDay=null, cursorTh=null, fit=null;
const MODELS=[["best_match","自动"],["ecmwf_ifs025","欧洲 ECMWF"],["gfs_seamless","美国 GFS"],["icon_seamless","德国 ICON"]];
const W_KG=()=>cfg.weight||75;

/* ---------- helpers ---------- */
const WK=["日","一","二","三","四","五","六"];
function parseT(s){const[y,m,d]=s.slice(0,10).split("-").map(Number);const h=+s.slice(11,13)||0,mi=+s.slice(14,16)||0;return Date.UTC(y,m-1,d,h,mi)/36e5}
function fmtHM(th){const d=new Date(th*36e5);return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0")}
function dayKey(th){return new Date(th*36e5).toISOString().slice(0,10)}
function wk(date){const[y,m,d]=date.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
const STOPS=[[0,[178,208,224]],[5,[120,182,222]],[9,[78,170,200]],[12,[72,190,140]],[16,[150,206,72]],[20,[236,206,60]],[24,[244,160,56]],[29,[232,98,58]],[36,[204,58,92]],[48,[140,48,140]]];
function windColor(k){if(k==null)return"transparent";let i=0;while(i<STOPS.length-2&&k>STOPS[i+1][0])i++;const[a0,c0]=STOPS[i],[a1,c1]=STOPS[i+1];const t=Math.max(0,Math.min(1,(k-a0)/(a1-a0)));const c=c0.map((v,j)=>Math.round(v+(c1[j]-v)*t));return`rgb(${c[0]},${c[1]},${c[2]})`}
function arrow(fromDeg){if(fromDeg==null)return"";return`<span class="arr"><svg viewBox="0 0 20 20" style="transform:rotate(${(fromDeg+180)%360}deg)"><path d="M10 2 L16 11 L11 9.5 L11 18 L9 18 L9 9.5 L4 11 Z" fill="currentColor"/></svg></span>`}
const CARD=["北","北偏东北","东北","东偏东北","东","东偏东南","东南","南偏东南","南","南偏西南","西南","西偏西南","西","西偏西北","西北","北偏西北"];
const dirName=d=>d==null?"":CARD[Math.round(d/22.5)%16];
const f1=v=>v==null?"–":(Math.round(v*10)/10).toFixed(1);
const f0=v=>v==null?"–":String(Math.round(v));
const UNIT={kn:["节",1],ms:["米/秒",0.514444],kmh:["公里/时",1.852]};
const wv=k=>{if(k==null)return"–";const v=k*UNIT[cfg.unit][1];return cfg.unit==="ms"?f1(v):f0(v)};
const wu=()=>UNIT[cfg.unit][0];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const dateCN=d=>`${+d.slice(5,7)}月${+d.slice(8)}日 周${WK[wk(d)]}`;

/* ---------- sailing logic ---------- */
const K=()=>({safe:0.88,std:1,bold:1.12}[cfg.style]||1);
function range(){const k=1.34*W_KG()*K();return{lo:k/(cfg.maxSail*1.08),hi:k/(cfg.minSail*0.85)}}
function quiver(){return String(cfg.quiver||"").split(/[,，\s]+/).map(Number).filter(x=>x>0).sort((a,b)=>a-b)}
function sailFor(kn){if(kn==null)return null;const r=range();if(kn<r.lo||kn>r.hi)return null;
  let s=Math.max(cfg.minSail,Math.min(cfg.maxSail,1.34*W_KG()*K()/kn));const q=quiver();
  if(q.length){let b=q[0];for(const x of q)if(Math.abs(x-s)<Math.abs(b-s))b=x;return b}return Math.round(s*2)/2}
function shore(wd,face){if(wd==null||face==null)return null;const d=Math.abs(((wd-face)%360+540)%360-180);
  if(d<=40)return{k:"on",t:"向岸风",c:"warn"};if(d<=100)return{k:"side",t:"侧岸风",c:"good"};if(d<=135)return{k:"sideoff",t:"侧离岸风",c:"warn"};return{k:"off",t:"离岸风",c:"bad"}}
function daylight(day){const s=data.sun[day];const hs=data.hours.filter(h=>h.date===day);if(!s)return hs.filter(h=>h.hh>=7&&h.hh<=18);const r=+s.rise.slice(11,13)+1,e=+s.set.slice(11,13)-1;return hs.filter(h=>h.hh>=r&&h.hh<=e)}
function okHour(h){return sailFor(h.ws)!=null&&(shore(h.wd,cur.face)||{}).k!=="off"}
function analyse(day){
  const hs=daylight(day);if(!hs.length)return null;
  let best=null,run=[];const flush=()=>{if(run.length&&(!best||run.length>best.length))best=run.slice();run=[]};
  hs.forEach(h=>{if(okHour(h))run.push(h);else flush()});flush();
  const mx=Math.max(...hs.map(h=>h.ws)),mn=Math.min(...hs.map(h=>h.ws)),r=range();
  const offHrs=hs.filter(h=>sailFor(h.ws)!=null&&(shore(h.wd,cur.face)||{}).k==="off").length;
  const res={hs,mx,mn,wave:Math.max(...hs.map(h=>h.wh??0)),offHrs};
  if(best&&best.length>=2){const sails=best.map(h=>sailFor(h.ws)).sort((a,b)=>a-b);
    Object.assign(res,{ok:true,win:best,from:best[0].hh,to:best[best.length-1].hh+1,sail:sails[Math.floor(sails.length/2)],avg:best.reduce((s,h)=>s+h.ws,0)/best.length,gust:Math.max(...best.map(h=>h.wg)),dir:best[Math.floor(best.length/2)].wd})}
  else if(offHrs>=2)res.why="off";else if(mx<r.lo)res.why="low";else if(mn>r.hi)res.why="high";else res.why="short";
  return res;
}

/* ---------- tide harmonic analysis ---------- */
const CONS=[28.9841042,30.0,28.4397295,15.0410686,13.9430356,13.3986609,57.9682084,58.9841042,57.4238337,27.8953548,27.9682084,28.5125831,29.5284789,86.9523127];
function fitTide(ts,vs){
  const pts=[];for(let i=0;i<ts.length;i++)if(vs[i]!=null)pts.push([ts[i],vs[i]]);
  if(pts.length<24*20)return null;
  const t0=pts.reduce((s,p)=>s+p[0],0)/pts.length;
  const w=CONS.map(c=>c*Math.PI/180);const n=1+2*w.length;
  const A=Array.from({length:n},()=>new Float64Array(n)),b=new Float64Array(n),row=new Float64Array(n);

    for(let i=0;i<n;i++){b[i]+=row[i]*y;const ri=row[i],Ai=A[i];for(let k=0;k<n;k++)Ai[k]+=ri*row[k]}}
  for(let i=0;i<n;i++)A[i][i]+=1e-6;
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];
    for(let r=c+1;r<n;r++){const f=A[r][c]/A[c][c];if(!f)continue;for(let k=c;k<n;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c]}}
  const x=new Float64Array(n);for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=A[r][k]*x[k];x[r]=s/A[r][r]}
  return {h:t=>{const tt=t-t0;let s=0;for(let j=0;j<w.length;j++)s+=x[1+2*j]*Math.cos(w[j]*tt)+x[2+2*j]*Math.sin(w[j]*tt);return s}};

function extrema(f,a,b){const out=[];const dt=0.1;let p=f(a-dt),c=f(a);for(let t=a;t<=b;t+=dt){const nx=f(t+dt);if(c>p&&c>=nx)out.push({t,hi:true});else if(c<p&&c<=nx)out.push({t,hi:false});p=c;c=nx}

/* ---------- data ---------- */
function urls(s,m){
  const fc=`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,precipitation,precipitation_probability&daily=sunrise,sunset&forecast_days=16&wind_speed_unit=kn&timezone=auto&models=${m}&cell_selection=sea`;
  const mv="wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,sea_surface_temperature";
  const mr=`https://marine-api.open-meteo.com/v1/marine?latitude=${s.lat}&longitude=${s.lon}&hourly=${mv}&forecast_days=16&timezone=auto&models=best_match,ncep_gfswave025&cell_selection=sea`;
  const td=`https://marine-api.open-meteo.com/v1/marine?latitude=${s.lat}&longitude=${s.lon}&hourly=sea_level_height_msl&past_days=92&forecast_days=16&timezone=auto&cell_selection=sea`;
  return{fc,mr,td};
}
async function getJSON(u){const r=await fetch(u);if(!r.ok){let m="";try{m=(await r.json()).reason}catch(e){}throw new Error(m||("HTTP "+r.status))}return r.json()}
function sameSpot(a,b){return a&&b&&Math.abs(a.lat-b.lat)<1e-3&&Math.abs(a.lon-b.lon)<1e-3}
function localDateIn(tz){try{return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}}
function nowTh(tz){try{const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return parseT(`${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}`)}catch(e){return null}}

function normalize(raw){
  const {fc,mr,td}=raw;const H=fc.hourly,M=mr.hourly;
  const mIdx=new Map(M.time.map((t,i)=>[t,i]));
  const pick=(k,i)=>{if(i==null)return null;const a=M[k+"_marine_best_match"]??M[k];const g=M[k+"_ncep_gfswave025"];const v=a?a[i]:null;return v!=null?v:(g?g[i]:null)};
  const hours=H.time.map((t,i)=>{const j=mIdx.get(t);
    return{t,th:parseT(t),date:t.slice(0,10),hh:+t.slice(11,13),ws:H.wind_speed_10m[i],wg:H.wind_gusts_10m[i]??H.wind_speed_10m[i],wd:H.wind_direction_10m[i],temp:H.temperature_2m[i],pr:H.precipitation[i],
      wh:pick("wave_height",j),wdir:pick("wave_direction",j),wp:pick("wave_period",j),sh:pick("swell_wave_height",j),sp:pick("swell_wave_period",j),sst:pick("sea_surface_temperature",j)}}).filter(h=>h.ws!=null);
  const sun={};fc.daily.time.forEach((d,i)=>sun[d]={rise:fc.daily.sunrise[i],set:fc.daily.sunset[i]});
  fit=fitTide(td.hourly.time.map(parseT),td.hourly.sea_level_height_msl);
  if(fit)hours.forEach(h=>h.tide=fit.h(h.th));
  const dates=[...new Set(hours.map(h=>h.date))].filter(d=>hours.filter(h=>h.date===d).length>=20);
  const tideX=fit?extrema(fit.h,hours[0].th,hours[hours.length-1].th+1):[];
  return{hours,sun,dates,tideX,tz:fc.timezone};
}

async function load(keepDay){
  if(!data)$("#app").innerHTML='<div class="loading">正在载入预报…</div>';
  $("#spotName").textContent=cur.name;
  const u=urls(cur,model);let raw=null,mode="live",err=null;
  try{const[fc,mr,td]=await Promise.all([getJSON(u.fc),getJSON(u.mr),getJSON(u.td)]);raw={fc,mr,td,fetched:new Date().toISOString()}}catch(e){err=e}
  if(!raw&&SNAPSHOT&&sameSpot(SNAPSHOT.spot,cur)){raw={fc:SNAPSHOT.fc[model]||SNAPSHOT.fc.best_match,mr:SNAPSHOT.mr,td:SNAPSHOT.td,fetched:SNAPSHOT.fetched};mode="snap"}
  if(!raw){data=null;$("#app").innerHTML=`<div class="banner"><b>载入失败</b>：${esc(err&&err.message||"网络错误")}。这个页面需要访问 open-meteo.com，请检查网络后再试。</div>`;return}
  data=normalize(raw);data.mode=mode;
  const today=localDateIn(data.tz);
  if(!keepDay||!data.dates.includes(selDay)){
    const n=nowTh(data.tz),s=data.sun[today];selDay=data.dates.includes(today)?today:data.dates[0];
    const nx=data.dates[data.dates.indexOf(selDay)+1];
    if(s&&n>parseT(s.set)-1.5&&nx)selDay=nx; // 今天快天黑了，直接看明天
  }
  $("#banner").innerHTML=mode==="snap"?`<div class="banner"><b>离线快照</b> · 抓取于 ${new Date(raw.fetched).toLocaleString("zh-CN",{timeZone:"Australia/Sydney",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}。这个预览不能联网，所以不会自动更新，也不能搜索新地点；放到 GitHub Pages 后每次打开都是最新数据。</div>`:"";
  render();
}

/* ---------- render ---------- */
function render(){
  const a=analyse(selDay);
  $("#app").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${verdict(a)}${chartCard()}
    <h2>16 天滑行日历</h2><p class="h2sub">每格是白天的一个小时，颜色代表风速；<span style="color:var(--good)">绿线</span>是适合你下水的时段。点一天看详情。</p>
    ${calendar()}${rawTable()}</div>`;
  drawChart();
}

function verdict(a){
  const i=data.dates.indexOf(selDay),today=localDateIn(data.tz),ti=data.dates.indexOf(today);
  const rel=selDay===today?"今天":i===ti+1?"明天":i===ti+2?"后天":"";
  const far=ti>=0?i-ti>=7:i>=7;
  let title,sub="",chips=[];
  if(!a){title=`<span class="no">没有数据</span>`}
  else if(a.ok){const sh=shore(a.dir,cur.face);
    title=`<span class="go">${a.from} 点到 ${a.to} 点能滑</span>，用 ${a.sail} m² 帆`;
    sub=`这段时间平均 ${wv(a.avg)} ${wu()}，阵风最高 ${wv(a.gust)}，${dirName(a.dir)}风${sh?`，${sh.t}`:""}。`;
    if(sh)chips.push(`<span class="chip ${sh.c}">${arrow(a.dir)} ${sh.t}</span>`);
    if(a.gust-a.avg>=10)chips.push(`<span class="chip warn">阵风忽大忽小</span>`);
  }else{
    const r=range();
    if(a.why==="low"){title=`<span class="no">风不够</span>`;sub=`白天最大 ${wv(a.mx)} ${wu()}，你最大的 ${cfg.maxSail} m² 帆大约要 ${wv(r.lo)} ${wu()} 以上才能滑起来。可以去冲浪、划 SUP，或者休息。`}
    else if(a.why==="high"){title=`<span class="hot">风太大</span>`;sub=`白天最小也有 ${wv(a.mn)} ${wu()}，超出你最小的 ${cfg.minSail} m² 帆能应付的范围。`}
    else if(a.why==="off"){title=`<span class="hot">风够，但是离岸风</span>`;sub=`风会把人往外海吹，出问题很难回来。没有救援船的话不建议下水。`}
    else{title=`<span class="no">合适的风不到 2 小时</span>`;sub=`白天风速在 ${wv(a.mn)}–${wv(a.mx)} ${wu()} 之间，适合你的时段太零散。`}
  }
  if(a){chips.push(`<span class="chip">浪 <b>${f1(a.wave)}</b> 米</span>`);
    const lows=data.tideX.filter(x=>dayKey(x.t)===selDay&&!x.hi);if(lows.length)chips.push(`<span class="chip">低潮 <b>${lows.map(x=>fmtHM(x.t)).join("、")}</b></span>`);
    if(far)chips.push(`<span class="chip warn">一周以后的预报，只看趋势</span>`);}
  const onboard=cfg.weight?"":`<div class="onboard"><span>输入体重，帆的建议会更准</span><span style="display:inline-flex;gap:8px;align-items:center;white-space:nowrap"><input id="obW" type="number" inputmode="decimal" placeholder="75" aria-label="体重">公斤<button type="button" id="obGo">好</button></span></div>`;
  return`<section class="verdict" aria-live="polite"><div class="vday"><span>${rel?`<b style="color:var(--ink)">${rel}</b> · `:""}${dateCN(selDay)}</span><span class="nav"><button type="button" data-step="-1" aria-label="前一天" ${i<=0?"disabled":""}>‹</button><button type="button" data-step="1" aria-label="后一天" ${i>=data.dates.length-1?"disabled":""}>›</button></span></div>
    <h1 class="vtitle">${title}</h1>${sub?`<p class="vsub">${sub}</p>`:""}<div class="chips">${chips.join("")}</div>${onboard}</section>`;
}

function chartCard(){
  return`<section class="chartcard"><div class="readout" id="readout"></div><svg class="chart" id="chart" role="img" aria-label="当天风、浪、潮汐变化图"></svg>
    <div class="tidelist" id="tides"></div>
    <div class="models"><span class="lab">风的模型</span>${MODELS.map(([k,l])=>`<button type="button" data-m="${k}" aria-pressed="${k===model}">${l}</button>`).join("")}</div>
    <div class="hint">在图上按住左右滑动，看每个钟点的数值。切换模型对比，差得越多说明那天越不确定。</div></section>`;
}

function drawChart(){
  const svg=$("#chart");const W=Math.max(300,Math.round(svg.parentNode.clientWidth)),pl=38,pr=14;
  const P1={y:10,h:130},P2={y:172,h:42},P3={y:232,h:46},H=300;

  const stp=wmax>30?10:5;for(let v=0;v<=wmax;v+=stp)g+=`<line x1="${pl}" x2="${W-pr}" y1="${yw(v)}" y2="${yw(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${yw(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${wv(v)}</text>`;
  g+=`<text x="4" y="${P1.y+4}" font-size="11" fill="var(--muted)">${wu()}</text>`;
  const top=hs.map(h=>`${x(h.th).toFixed(1)},${yw(h.wg).toFixed(1)}`).join(" "),bot=hs.slice().reverse().map(h=>`${x(h.th).toFixed(1)},${yw(h.ws).toFixed(1)}`).join(" ");
  g+=`<polygon points="${top} ${bot}" fill="var(--ink)" opacity=".07"/><polyline points="${top}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;
  for(let i=0;i<hs.length-1;i++){const a=hs[i],b=hs[i+1];g+=`<line x1="${x(a.th)}" y1="${yw(a.ws)}" x2="${x(b.th)}" y2="${yw(b.ws)}" stroke="${windColor((a.ws+b.ws)/2)}" stroke-width="4" stroke-linecap="round"/>`}
  g+=`<text x="${pl+4}" y="${P1.y+12}" font-size="11" fill="var(--muted)">实线 风速 · 虚线 阵风</text>`;
  hs.filter(h=>h.hh%3===0&&h.th<t1).forEach(h=>{g+=`<g transform="translate(${x(h.th)} ${P1.y+P1.h+12}) rotate(${(h.wd+180)%360})"><path d="M0 -6 L4.5 4 L0 2 L-4.5 4 Z" fill="var(--muted)"/></g>`});
  const a=analyse(day);if(a&&a.ok)g+=`<rect x="${x(a.win[0].th)}" y="${P1.y+P1.h+22}" width="${x(a.win[a.win.length-1].th+1)-x(a.win[0].th)}" height="4" rx="2" fill="var(--good)"/>`;
  const wmx=Math.max(1.5,...hs.map(h=>h.wh||0));const bw=Math.max(2,(W-pl-pr)/24-2);
  g+=`<text x="4" y="${P2.y+10}" font-size="11" fill="var(--muted)">浪</text><text x="${pl-6}" y="${P2.y+8}" text-anchor="end" font-size="11" fill="var(--muted)">${f1(wmx)}</text>`;
  hs.filter(h=>h.th<t1&&h.wh!=null).forEach(h=>{const bh=Math.max(1,h.wh/wmx*P2.h);g+=`<rect x="${x(h.th)+1}" y="${P2.y+P2.h-bh}" width="${bw}" height="${bh}" rx="1.5" fill="var(--sea)" opacity=".7"/>`});
  if(fit){const all=data.tideX.map(e=>e.h);const tmn=Math.min(...all),tmx=Math.max(...all);const yt=v=>P3.y+P3.h-(v-tmn)/((tmx-tmn)||1)*P3.h;
    let p="";for(let t=t0;t<=t1+1e-9;t+=0.25)p+=(p?" L":"M")+`${x(t).toFixed(1)} ${yt(fit.h(t)).toFixed(1)}`;
    g+=`<text x="4" y="${P3.y+10}" font-size="11" fill="var(--muted)">潮</text><path d="${p} L${x(t1)} ${P3.y+P3.h} L${x(t0)} ${P3.y+P3.h} Z" fill="var(--tidefill)"/><path d="${p}" fill="none" stroke="var(--tide)" stroke-width="2"/>`;
    data.tideX.filter(e=>e.t>=t0&&e.t<t1).forEach(e=>g+=`<circle cx="${x(e.t)}" cy="${yt(e.h)}" r="3" fill="var(--tide)"/>`)}
  for(let h=0;h<=24;h+=3)g+=`<text x="${x(t0+h)}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">${String(h).padStart(2,"0")}</text>`;
  const n=nowTh(data.tz);if(n&&n>=t0&&n<=t1)g+=`<line x1="${x(n)}" x2="${x(n)}" y1="0" y2="${P3.y+P3.h}" stroke="var(--accent)" stroke-width="1.5" opacity=".75"/><text x="${x(n)+3}" y="${P3.y+P3.h+0}" font-size="10" fill="var(--accent)">现在</text>`;

  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("height",H);svg.innerHTML=g;

  const setCur=th=>{th=Math.max(t0,Math.min(t1-1,Math.round(th)));cursorTh=th;const h=data.hours.find(z=>z.th===th);if(!h)return;
    $("#cl").setAttribute("x1",x(th));$("#cl").setAttribute("x2",x(th));$("#cd").setAttribute("cx",x(th));$("#cd").setAttribute("cy",yw(h.ws));
    const sl=sailFor(h.ws),sh=shore(h.wd,cur.face);

      <div class="ro"><span class="l">${arrow(h.wd)} ${dirName(h.wd)}${sh?" · "+sh.t:""}</span><span class="v" style="color:${windColor(h.ws)}">${wv(h.ws)}<small> 阵风${wv(h.wg)}</small></span></div>
      <div class="ro"><span class="l">浪高 · 周期</span><span class="v">${f1(h.wh)}<small> 米 ${f1(h.wp)}秒</small></span></div>

  setCur(cursorTh!=null&&cursorTh>=t0&&cursorTh<t1?cursorTh:(n&&n>=t0&&n<t1?n:(a&&a.ok?a.win[0].th:t0+12)));
  const pick=e=>{const b=svg.getBoundingClientRect();const px=(e.clientX-b.left)/b.width*W;setCur(t0+(px-pl)/(W-pl-pr)*24)};
  let down=false;svg.onpointerdown=e=>{down=true;pick(e)};svg.onpointermove=e=>{if(down||e.pointerType==="mouse")pick(e)};window.onpointerup=()=>{down=false};
}

function calendar(){
  const today=localDateIn(data.tz),ti=data.dates.indexOf(today);
  return`<div class="cal"><div class="calaxis"><span></span><div><span>5点</span><span>9</span><span>13</span><span>17</span><span>20</span></div><span style="text-align:right">适合你</span></div>${data.dates.map((d,i)=>{
    const a=analyse(d);const hs=data.hours.filter(h=>h.date===d&&h.hh>=5&&h.hh<=20);const s=data.sun[d];
    const rise=s?+s.rise.slice(11,13):6,set=s?+s.set.slice(11,13):19;const win=a&&a.ok?new Set(a.win.map(h=>h.hh)):new Set();
    const cells=hs.map(h=>`<i class="${win.has(h.hh)?"ok":""}${h.hh<rise||h.hh>set?" off":""}" style="background:${windColor(h.ws)}"></i>`).join("");

}

function rawTable(){
  const hs=data.hours.filter(h=>h.date===selDay);const s=data.sun[selDay];const night=h=>s&&(h.hh<+s.rise.slice(11,13)||h.hh>+s.set.slice(11,13));
  const rows=[["hr","时间",h=>String(h.hh).padStart(2,"0")],["","风向",h=>arrow(h.wd)],["c","风速 "+wu(),h=>wv(h.ws),h=>`background:${windColor(h.ws)}`],["c","阵风 "+wu(),h=>wv(h.wg),h=>`background:${windColor(h.wg)}`],
    ["","建议帆",h=>{const v=sailFor(h.ws);return v?`<span style="color:var(--good)">${v}</span>`:"–"}],["s","气温 °C",h=>f0(h.temp)],["s","降水 毫米",h=>h.pr?f1(h.pr):"0"],
    ["","浪向",h=>arrow(h.wdir)],["","浪高 米",h=>f1(h.wh)],["s","周期 秒",h=>f1(h.wp)],["s","涌浪 米",h=>f1(h.sh)],["s","涌周期 秒",h=>f1(h.sp)],["s","水温 °C",h=>f0(h.sst)],["s","潮位 米",h=>h.tide==null?"–":(h.tide>=0?"+":"")+h.tide.toFixed(1)]];
  return`<details class="raw" id="rawd"${rawOpen?" open":""}><summary>${dateCN(selDay)} · 逐小时数据表</summary><div class="sheetwrap"><table class="sheet"><tbody>${rows.map(([c,l,fn,st])=>`<tr class="${c==="hr"?"hr":""}"><th>${l}</th>${hs.map(h=>`<td class="${c}${night(h)?" n":""}"${st?` style="${st(h)}"`:""}>${fn(h)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
}
let rawOpen=false;

/* ---------- drawers ---------- */
function openDrawer(html,onMount){$("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="drawer" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim"||e.target.closest("[data-close]"))closeDrawer()});onMount&&onMount()}
function closeDrawer(){$("#layer").innerHTML=""}
const FACES=[[0,"北"],[45,"东北"],[90,"东"],[135,"东南"],[180,"南"],[225,"西南"],[270,"西"],[315,"西北"]];
const seg=(id,opts,val)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(v)===String(val)}">${l}</button>`).join("")}</div>`;

function spotDrawer(){
  const list=()=>spots.map((s,i)=>`<div class="item" aria-current="${sameSpot(s,cur)}"><button type="button" class="main" data-pick="${i}"><span>${esc(s.name)}</span><small>${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}${s.face!=null?` · 海岸朝${(FACES.find(f=>f[0]===s.face)||[])[1]||""}`:""}</small></button>${spots.length>1?`<button type="button" class="del" data-del="${i}" aria-label="删除 ${esc(s.name)}">×</button>`:""}</div>`).join("");
  openDrawer(`<h3>地点<button type="button" data-close>完成</button></h3>
    <div class="field"><label>搜索新地点</label><div class="srow"><input id="q" type="search" placeholder="海滩名或地名，也可以输入 纬度,经度" autocomplete="off"><button class="btn" id="go" type="button">搜索</button></div><div class="list" id="res"></div></div>
    <div class="field"><label>${esc(cur.name)} 的海岸朝向（站在岸上，面朝大海的方向）</label>${seg("face",[...FACES,["","不设"]],cur.face??"")}<div class="fhint">用来分辨向岸风、侧岸风和危险的离岸风。Long Reef 默认按朝东设置，如果你常下水的位置不是朝东，请改一下。</div></div>
    <div class="field"><label>我的地点</label><div class="list" id="saved">${list()}</div></div>`,()=>{
    const run=async()=>{const q=$("#q").value.trim(),box=$("#res");if(!q)return;
      const m=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
      if(m){addSpot({name:`${(+m[1]).toFixed(3)}, ${(+m[2]).toFixed(3)}`,lat:+m[1],lon:+m[2],face:null});return}
      box.innerHTML='<div class="fhint">搜索中…</div>';
      try{const r=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=zh&format=json`);const res=r.results||[];
        box.innerHTML=res.length?res.map((p,i)=>`<div class="item"><button type="button" class="main" data-r="${i}"><span>${esc(p.name)}</span><small>${esc([p.admin1,p.country].filter(Boolean).join("，"))}</small></button><span aria-hidden="true">＋</span></div>`).join(""):'<div class="msg">没找到。试试英文名（例如 Long Reef），或者直接输入 纬度,经度。</div>';
        box.onclick=e=>{const b=e.target.closest("[data-r]");if(b){const p=res[+b.dataset.r];addSpot({name:p.name,lat:p.latitude,lon:p.longitude,face:null})}};
      }catch(e){box.innerHTML='<div class="msg">搜索要联网访问 open-meteo.com，这个预览环境不允许。放到 GitHub Pages 后就能搜。</div>'}};
    $("#go").onclick=run;$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
    $("#face").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;cur.face=b.dataset.v===""?null:+b.dataset.v;const i=spots.findIndex(s=>sameSpot(s,cur));if(i>=0)spots[i].face=cur.face;store.set("wr3.spots",spots);store.set("wr3.cur",cur);
      $("#face").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#saved").innerHTML=list();if(data)render()});
    $("#saved").onclick=e=>{const d=e.target.closest("[data-del]");if(d){const i=+d.dataset.del;const was=sameSpot(spots[i],cur);spots.splice(i,1);store.set("wr3.spots",spots);$("#saved").innerHTML=list();if(was){choose(spots[0]);closeDrawer()}return}
      const p=e.target.closest("[data-pick]");if(p){choose(spots[+p.dataset.pick]);closeDrawer()}};
  });
  function addSpot(s){const ex=spots.find(x=>sameSpot(x,s));if(!ex){spots.push(s);store.set("wr3.spots",spots)}choose(ex||s);closeDrawer()}
}
function choose(s){cur=s;store.set("wr3.cur",cur);data=null;load()}

function setDrawer(){
  openDrawer(`<h3>我的帆板<button type="button" data-close>完成</button></h3>
    <div class="field"><label>体重（公斤）</label><input id="weight" type="number" inputmode="decimal" min="30" max="150" step="1" value="${cfg.weight??""}" placeholder="75"><div class="fhint">建议帆按经验公式估算：帆面积 ≈ 1.34 × 体重 ÷ 风速（节）。</div></div>
    <div class="two"><div class="field"><label>最小的帆 m²</label><input id="minSail" type="number" inputmode="decimal" step="0.1" value="${cfg.minSail}"></div><div class="field"><label>最大的帆 m²</label><input id="maxSail" type="number" inputmode="decimal" step="0.1" value="${cfg.maxSail}"></div></div>
    <div class="field"><label>我有的帆（可选）</label><input id="quiver" type="text" placeholder="例如 4.7, 5.8, 7.0, 8.5" value="${esc(cfg.quiver)}"><div class="fhint">填了以后，建议会直接选你手上最接近的那张。</div></div>
    <div class="field"><label>风格</label>${seg("style",[["safe","保守"],["std","标准"],["bold","激进"]],cfg.style)}<div class="fhint">保守：帆小一号，好控制；激进：帆大一号，更早滑行。</div></div>
    <div class="field"><label>风速单位</label>${seg("unit",[["kn","节"],["ms","米/秒"],["kmh","公里/时"]],cfg.unit)}</div>`,()=>{
    const num=(id,min,max)=>{const el=$("#"+id);el.addEventListener("change",()=>{let v=parseFloat(el.value);if(!isFinite(v)){if(id==="weight"){cfg.weight=null;save();return}v=cfg[id]}v=Math.max(min,Math.min(max,v));el.value=v;cfg[id]=v;if(cfg.minSail>cfg.maxSail){[cfg.minSail,cfg.maxSail]=[cfg.maxSail,cfg.minSail]}save()})};
    num("weight",30,150);num("minSail",1,13);num("maxSail",1,13);
    $("#quiver").addEventListener("change",e=>{cfg.quiver=e.target.value;save()});
    ["style","unit"].forEach(id=>$("#"+id).addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;cfg[id]=b.dataset.v;$("#"+id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));save()}));
  });
}
function save(){store.set("wr3.cfg",cfg);if(data)render()}

/* ---------- events ---------- */
$("#spotBtn").onclick=spotDrawer;
$("#setBtn").onclick=setDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
$("#app").addEventListener("toggle",e=>{if(e.target.id==="rawd")rawOpen=e.target.open},true);
$("#app").addEventListener("click",e=>{
  const st=e.target.closest("[data-step]");if(st){const i=data.dates.indexOf(selDay)+ +st.dataset.step;if(data.dates[i]){selDay=data.dates[i];cursorTh=null;render()}return}
  const m=e.target.closest("[data-m]");if(m){if(m.dataset.m!==model){model=m.dataset.m;store.set("wr3.model",model);const c=cursorTh;load(true).then(()=>{if(data&&c!=null){cursorTh=c;render()}})}return}
  const row=e.target.closest(".crow");if(row){selDay=row.dataset.d;cursorTh=null;render();document.querySelector(".verdict").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(e.target.id==="obGo"){const v=parseFloat($("#obW").value);if(v>=30&&v<=150){cfg.weight=v;save()}else $("#obW").focus();return}
});
$("#app").addEventListener("keydown",e=>{if(e.target.id==="obW"&&e.key==="Enter")$("#obGo").click()});
let rw=0;window.addEventListener("resize",()=>{clearTimeout(rw);rw=setTimeout(()=>{if(data&&$("#chart"))drawChart()},150)});

load();
})();
</script>

</body>
</html>
